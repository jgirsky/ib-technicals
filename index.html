t is implied EQUITY value directly, with no bridge.\nKey for banks and insurers, and useful for steady dividend payers like utilities.", "tip": null}, {"id": "val-a22f7ffa", "m": "val", "t": "qa", "f": 2, "c": false, "q": "Why use an M&A premiums analysis?", "a": "Public targets only. Look at the premiums paid in similar deals (e.g., a 20% median) and apply them to your company's share price ($10 → $12).\nIt supplements precedents, but it can't tell you the company is currently mispriced.", "tip": null}, {"id": "val-becdb336", "m": "val", "t": "qa", "f": 2, "c": false, "q": "Sum-of-the-parts: when, and what are the drawbacks?", "a": "When: conglomerates with very different divisions (retail + logistics + media), where no single peer group fits.\nDrawbacks: much more work (comps and a DCF per segment), segment data like EBIT, CapEx, and working capital is often missing, and you have to subtract unallocated corporate overhead.", "tip": null}, {"id": "val-ad5a264a", "m": "val", "t": "qa", "f": 2, "c": false, "q": "How does an LBO valuation work, and when is it useful?", "a": "Build an LBO, set a target IRR (say 20 to 25%), and solve for the maximum price a PE firm could pay.\nThat gives a \"floor\": the price a financial buyer could justify. It's useful for screening LBO candidates and showing a seller what sponsors might pay vs. strategic buyers.", "tip": null}, {"id": "val-1f3a959a", "m": "val", "t": "qa", "f": 1, "c": false, "q": "What's a Future Share Price Analysis?", "a": "Project the share price in a few years (a multiple × future EBITDA → bridge → divide by future shares) plus dividends along the way, and discount it all back at the Cost of Equity. Compare to today's price.\nIt adds little beyond comps, but it helps test changes in capital structure or dividend policy.", "tip": null}, {"id": "val-1a86a5d7", "m": "val", "t": "concept", "f": 2, "c": true, "q": "What's a \"football field\"?", "a": "The summary chart: horizontal bars showing the implied value range (EV or share price) from each method, like 52-week range, comps, precedents, DCF, LBO, with the current price drawn as a line. It's how you show a client a defensible range instead of one number.", "tip": null}, {"id": "dcf-0f1683f4", "m": "dcf", "t": "walk", "f": 3, "c": true, "q": "Walk me through a DCF.", "a": "1. Project Unlevered FCF for 5 to 10 years: revenue growth, margins, taxes, D&A, working capital, CapEx.\n2. Discount each year at the discount rate, usually WACC.\n3. Estimate a Terminal Value for everything after the forecast, using an exit multiple or Gordon Growth, and discount it back too.\n4. PV of the FCFs + PV of the TV = implied Enterprise Value.\n5. Bridge: + cash, − debt, − preferred, − NCI, etc. → implied Equity Value → ÷ diluted shares → implied share price. Compare to the current price, across a range of assumptions.", "tip": "Practice this until it takes about 45 seconds out loud. It's the most-asked question in the guide."}, {"id": "dcf-84721295", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "Why build a DCF in the first place?", "a": "A company is worth the present value of its future cash flows. But growth and risk change over time, so one CF / (r − g) formula won't work.\nThe DCF splits the life of the company into an explicit forecast period (where things change) and a terminal period (a steady state), values both, and adds them.", "tip": null}, {"id": "dcf-47914285", "m": "dcf", "t": "walk", "f": 3, "c": true, "q": "How do you get from revenue to Unlevered Free Cash Flow?", "a": "Revenue − COGS − OpEx = EBIT\n× (1 − tax rate) = NOPAT\n+ D&A (and other true non-cash charges)\n± change in working capital (WC up = cash out)\n− CapEx\n= Unlevered FCF", "tip": "First confirm they mean unlevered. Levered FCF also deducts interest and includes net debt issued or repaid."}, {"id": "dcf-8b02068b", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "What's the logic behind what goes into UFCF and what stays out?", "a": "UFCF matches Enterprise Value: core, recurring cash flow available to ALL investors.\nOut: interest (only lenders get it), other income (non-core assets), most non-cash items besides D&A (non-recurring), all financing items, and investing items other than CapEx.\nIn: working capital changes and CapEx, because they're recurring and core.", "tip": null}, {"id": "dcf-0487fc11", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "Should you add back Stock-Based Compensation in FCF?", "a": "No. Treat it as a real cash expense. It dilutes existing owners, so it isn't a mere timing difference like D&A.\nIf you DO add it back, you have to increase the share count to reflect future dilution. Either way, the implied share price should fall. Adding it back AND ignoring dilution is the common mistake.", "tip": "Analogy: paying your house manager with a 1% stake each year. No cash leaves, but you own less when you sell."}, {"id": "dcf-1e90bcac", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "What tax rate do you use in FCF?", "a": "Whatever gets you to the right CASH taxes. Commonly the effective rate plus a deferred-tax adjustment. A cash tax rate or an adjusted statutory rate also works if it's done consistently.", "tip": null}, {"id": "dcf-49e6272c", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How should CapEx and D&A behave across the forecast?", "a": "Both should trend down as a % of revenue as growth slows.\nIf the company is still growing, CapEx stays above D&A, even in the terminal year (inflation, plus PP&E has to grow to support the growth). CapEx = D&A implies zero growth.", "tip": null}, {"id": "dcf-4863ceba", "m": "dcf", "t": "qa", "f": 1, "c": false, "q": "Do you model inflation separately in a DCF?", "a": "Usually not. Projections are already in nominal terms (prices and wages as quoted), and forecasting inflation explicitly adds a lot of guesswork for little benefit.", "tip": null}, {"id": "dcf-a94e0fe2", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "What's the link between what you deduct in FCF and the bridge at the end?", "a": "If FCF deducts an expense, IGNORE its liability in the bridge. If FCF excludes the expense, SUBTRACT the liability in the bridge.\nDebt: UFCF excludes interest → subtract debt.\nU.S. operating leases: rent is deducted in FCF → don't subtract lease liabilities.\nOtherwise you double-count (or miss) the claim.", "tip": null}, {"id": "dcf-b5d9c545", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How do NOLs, pensions, and one-off items fit into FCF?", "a": "NOLs: either model them to reduce cash taxes, or (much easier) add them as an asset in the bridge. Not both.\nPensions: deduct the service cost and company contributions (operating), exclude the interest and return components, and subtract the unfunded amount in the bridge.\nAsset sales, impairments, M&A: leave them out unless announced. They're non-recurring.", "tip": null}, {"id": "dcf-ff99b306", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How do you treat leases in a DCF?", "a": "Simplest: deduct the FULL lease cost (all lease types) in UFCF as an operating cost. Then leave lease liabilities out of the bridge and out of WACC.\nThe alternative (treating leases as capital: add back lease costs, subtract the liabilities, include them in WACC) is more work and barely changes the answer.", "tip": null}, {"id": "dcf-4ecabe38", "m": "dcf", "t": "concept", "f": 3, "c": true, "q": "What does the discount rate mean in a DCF?", "a": "The investors' opportunity cost: the annual return they could expect from similar-risk companies.\nHigher → riskier, better alternatives → lower value. Lower → higher value.\nFor UFCF, use WACC (all investors). For levered FCF, use the Cost of Equity.", "tip": null}, {"id": "dcf-4414b6a8", "m": "dcf", "t": "walk", "f": 3, "c": true, "q": "How do you calculate WACC?", "a": "WACC = Cost of Equity × %Equity + Cost of Debt × (1 − t) × %Debt + Cost of Preferred × %Preferred\nUse market values for the weights, often a peer-median or target capital structure.\nCost of Equity: CAPM. Cost of Debt: the yield to maturity, or risk-free rate + credit spread. Preferred: its yield (not tax-adjusted).", "tip": null}, {"id": "dcf-94adb9bd", "m": "dcf", "t": "walk", "f": 3, "c": true, "q": "How do you calculate the Cost of Equity?", "a": "Cost of Equity = Risk-Free Rate + Equity Risk Premium × Levered Beta\n• Rf: the long-term government bond yield in the currency of the cash flows (10- or 20-year).\n• ERP: how much that stock market returns over Rf in the long run (~5 to 6% in developed markets).\n• Beta: the stock's sensitivity to the market, including leverage risk.", "tip": null}, {"id": "dcf-848be1c2", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "What does the Cost of Equity mean intuitively?", "a": "The average annual return the stock \"should\" deliver over the long term, from price gains plus dividends.\nTo the company, it's the cost of raising money by selling shares, paid through dilution and potential dividends.", "tip": null}, {"id": "dcf-b8a87428", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "What does WACC mean intuitively?", "a": "The expected annual return from owning a proportional slice of the company's debt, equity, and preferred.\nTo the company, it's the blended cost of funding with all sources at its target mix. Take on projects or deals whose IRR beats it.", "tip": null}, {"id": "dcf-3b9414bb", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "What is Beta?", "a": "How much a stock moves relative to the market. β = 1.5 → the market +10%, the stock +15% (and −15% on the way down).\nLevered Beta = business risk + leverage risk. Unlevered Beta = business risk only, so it's ≤ levered.", "tip": "It can be negative (gold-like hedges), but that's rare and usually temporary for operating companies."}, {"id": "dcf-329059b9", "m": "dcf", "t": "concept", "f": 2, "c": true, "q": "Why un-lever and re-lever Beta, and what are the formulas?", "a": "Peers' betas include THEIR leverage. Un-lever each to isolate pure business risk, take the median, then re-lever at YOUR company's (or target) capital structure.\nβu = βL / (1 + D/E × (1 − t) + P/E)\nβL = βu × (1 + D/E × (1 − t) + P/E)\n(1 − t) appears because the interest tax shield makes debt less risky.", "tip": "You still do this in an unlevered DCF. It's about the discount rate, not the cash flows."}, {"id": "dcf-71204c30", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "Why is equity more expensive than debt?", "a": "Equity holders are paid last, so they take more risk and expect higher returns (~7 to 10% in developed markets vs. lower bond yields).\nAnd interest is tax-deductible, which shrinks the after-tax cost of debt further.", "tip": null}, {"id": "dcf-48649adf", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How do you estimate the Cost of Debt and Cost of Preferred?", "a": "What it would cost to issue MORE today: the yield to maturity on existing bonds, or Rf + a spread for its credit rating, or a weighted coupon as a fallback.\nDebt is tax-adjusted × (1 − t) in WACC. Preferred isn't, since its dividends aren't deductible.\nRanking: Debt < Preferred < Equity.", "tip": null}, {"id": "dcf-0ba5c307", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How do the Cost of Equity, the Cost of Debt, and WACC move as debt rises?", "a": "The Cost of Equity and the Cost of Debt BOTH rise, because bankruptcy risk hits everyone.\nWACC: falls at first (cheap, tax-deductible debt replaces equity), then rises once distress risk dominates. A U-shaped curve.\nSo going from 0% to 20% debt usually lowers WACC and raises DCF value.", "tip": null}, {"id": "dcf-a5c8d614", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "A company with 20% debt pays it all off. What happens to WACC?", "a": "If you use its current capital structure: WACC likely rises (at low debt, debt's benefit outweighs its risk).\nIf you use a target or peer-median structure: no change.", "tip": null}, {"id": "dcf-a2f81fb5", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Current vs. \"optimal\" capital structure for WACC. Total vs. net debt?", "a": "You can't truly calculate the optimal structure, so use the peer median as a proxy. That's the same logic as re-levering beta: what it SHOULD be, since the DCF values expected cash flows.\nUse total debt, not net. Cash doesn't offset debt 1:1, and netting gives absurd weights for cash-rich companies.", "tip": null}, {"id": "dcf-1ce2e49b", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How do convertible bonds affect WACC?", "a": "In the money (price > conversion price): treat them as equity → more diluted shares and a bigger equity weight.\nOut of the money: treat them as debt, priced at the yield of comparable NON-convertible bonds. The convert's coupon is artificially low because of the conversion option.", "tip": null}, {"id": "dcf-c84e91ad", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "How would you estimate the Cost of Equity for a high-growth U.S. tech company, right now?", "a": "State live numbers: Rf ≈ the current 10-year Treasury yield (look it up the morning of the interview), ERP ≈ 5 to 6%, beta ≈ 1.3 to 1.5 for a volatile growth stock.\nE.g., if the 10-year is ~4.5%: 4.5% + 1.4 × 5.5% ≈ 12%.", "tip": "Your Fed background helps here. Know where the 10-year yield is that day."}, {"id": "dcf-09424b39", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Which risk-free rate for a company operating in the U.S., EU, and U.K.? What if the government isn't risk-free (Greece)?", "a": "Match the CURRENCY of the cash flows: USD → Treasuries, EUR → euro sovereign bonds, GBP → gilts.\nRisky sovereign: take a truly safe rate and add a default spread for that country's credit rating.", "tip": null}, {"id": "dcf-eda738de", "m": "dcf", "t": "qa", "f": 1, "c": false, "q": "How do you get the Equity Risk Premium, including for multinationals?", "a": "Long-run market returns over Rf (sources like Kroll/Ibbotson or Damodaran), or a standard 5 to 6% in developed markets.\nMultinationals: weight each country's ERP by its share of revenue. For riskier countries, use the U.S. ERP + a country default spread.", "tip": null}, {"id": "dcf-a27cc97a", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Should the discount rate ever change over the forecast?", "a": "Yes, for a fast-growing company that will mature. E.g., start at a 12% WACC and step down ~0.4%/year to a mature peer level of ~8.4%. Also when the capital structure is expected to change. It's less relevant for already-mature companies.", "tip": null}, {"id": "dcf-33b6c40b", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "Should a $500M or a $5B company have the higher WACC?", "a": "The $500M company (same capital structure). Smaller → riskier with higher potential returns, so a higher Cost of Equity, and a higher default risk, so a higher Cost of Debt.", "tip": null}, {"id": "dcf-a969b6a9", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Same company, emerging market vs. developed market: whose WACC is higher?", "a": "Usually the EM company's: a higher Rf, ERP, and Cost of Debt. Not guaranteed. A different capital structure or a low beta (say, a state-controlled sector) can offset it.", "tip": null}, {"id": "dcf-a6bfcc8c", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "How do you calculate Terminal Value, and which method is better?", "a": "Exit multiple: final-year EBITDA (or EBIT…) × a peer multiple. E.g., $500 × 10x = $5,000.\nGordon Growth: TV = FCF(final) × (1 + g) / (r − g).\nGordon Growth is more defensible in theory (every company eventually grows at or below GDP), and multiples can quietly imply crazy growth. Bankers still love multiples because they're easy. Best practice: cross-check one against the other.", "tip": null}, {"id": "dcf-f8df1c44", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "What's the intuition behind the Gordon Growth formula?", "a": "It's just CF / (r − g) for the first terminal-year cash flow.\n$100 of cash flow, 10% discount rate, no growth → $1,000. Growth of 3% → $100 / 7% ≈ $1,429.\nHigher growth lets you pay more and still earn your target return. A higher discount rate means better alternatives, so you pay less.", "tip": null}, {"id": "dcf-f5983349", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "How do you pick the terminal growth rate?", "a": "Below long-run nominal GDP growth for the country (otherwise the company eventually becomes bigger than the economy), and around inflation. In developed markets, often 1 to 3%. Then sanity-check the implied exit multiple.", "tip": null}, {"id": "dcf-047de993", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Using the multiples method, do you use public comps or precedent multiples?", "a": "Public comps, ideally forward 1 to 2 years. Precedents include a control premium that doesn't belong in a standalone valuation. Then check the growth rate it implies.", "tip": null}, {"id": "dcf-c1fbfae5", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "How do you check whether your Terminal Value is reasonable?", "a": "Cross-check. An exit multiple implies a perpetual growth rate, and a growth rate implies a multiple.\nE.g., at a 12% WACC, 10x EBITDA implies ~5% growth (too high), 6x implies ~1% (too low), and 8x implies ~2.3% (reasonable). Use 8x as the base case and sensitize around it.\nAlso check that the TV isn't ~90%+ of total value.", "tip": null}, {"id": "dcf-1f039873", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Why discount the TV, and why use year N (not N+1) for a 10-year forecast?", "a": "The TV is a value AS OF the end of year 10. It's the PV at that date of cash flows from year 11 onward. You still need to bring it back to today, so discount it 10 periods.", "tip": null}, {"id": "dcf-07641e90", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "What's one problem with EBITDA multiples for the Terminal Value?", "a": "EBITDA ignores CapEx. Two companies at the same multiple can have very different FCF and growth, so their true values differ. EBIT, NOPAT, or FCF multiples help but are less comparable. That's one more reason Gordon Growth is the \"real\" method.", "tip": null}, {"id": "dcf-662ffc6d", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Does a negative terminal growth rate ever make sense?", "a": "Yes, e.g., a pharma company whose key patent expires during the forecast and won't be replaced, or a melting-ice-cube business. It means cash flows eventually fade. The company is worth less, not worthless.", "tip": null}, {"id": "dcf-2381402c", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "What are warning signs that a DCF is off?", "a": "• TV is ~90%+ of value (50 to 75% is normal).\n• The implied terminal growth or multiple makes no sense (an 8% perpetual growth rate).\n• Final-year FCF growth is far from the terminal growth rate (15% → 2% overnight).\n• Double-counting: deducting an expense in FCF AND its liability in the bridge.\n• Margins still expanding at the end, or CapEx ≤ D&A while you assume growth.", "tip": null}, {"id": "dcf-5b4631c0", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Your DCF looks off. Quickest fixes?", "a": "Extend the forecast (e.g., 5 → 10 to 15 years) so growth can taper toward the terminal rate and the explicit FCF carries more of the value. Remove any double-counting. Pull down an inflated terminal growth rate or exit multiple.", "tip": null}, {"id": "dcf-6161ba6d", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "How do you interpret DCF output?", "a": "Compare the implied share price or EV range to the current one, across sensitivities. Implied $15 to $20 vs. trading at $8 → possibly undervalued. Trading at $17 → about fair.", "tip": null}, {"id": "dcf-4b2a8c0b", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Does a DCF work for a company with negative cash flow today?", "a": "It can, if there's a believable path to positive cash flow (you may need a longer forecast). If there's no path you can forecast, use comps or other methods instead.", "tip": null}, {"id": "dcf-930131de", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "Levered DCF: what changes vs. an unlevered DCF?", "a": "• Cash flow: Levered FCF (after interest, ± net debt issued or repaid).\n• Discount rate: Cost of Equity.\n• TV: an equity-value multiple (P/E) or growth on LFCF.\n• No bridge: the output IS implied Equity Value.\nResults won't match the unlevered version. Assumptions are hard to align, and LFCF swings around with debt flows. Almost nobody uses it outside niches (some REITs, midstream).", "tip": null}, {"id": "dcf-7ec5e098", "m": "dcf", "t": "qa", "f": 1, "c": false, "q": "What's an APV analysis, and why isn't it standard?", "a": "An unlevered DCF at the unlevered Cost of Equity, plus the separately valued PV of interest tax shields.\nFlaw: it captures the benefit of debt but not the higher bankruptcy risk (unless you add that separately). WACC's U-curve captures both.", "tip": null}, {"id": "dcf-d4189d5f", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "A client wants to raise debt/capital from 10% to 30%. A coworker says the unlevered DCF won't change. Right?", "a": "No. UFCF won't change, but WACC will. Calculate WACC under each structure and let it move year by year as leverage rises.", "tip": null}, {"id": "dcf-7beb682f", "m": "dcf", "t": "qa", "f": 3, "c": true, "q": "The Fed raises short-term rates from 2% to 5%. What happens to WACC and the DCF value?", "a": "Most likely WACC rises and value falls. A higher risk-free rate pushes up the Cost of Equity (Rf + β × ERP) and the Cost of Debt.\nCaveat: a DCF uses LONG-term yields. If the 10-year doesn't move (an inverted or flattening curve), the impact is muted.", "tip": "This is your home turf. Mention the yield curve."}, {"id": "dcf-76dfe0f3", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "Which matters more: revenue growth 10% → 5%, or the discount rate 10% → 5%?", "a": "The discount rate, almost certainly. It hits the PV of every cash flow AND the terminal value, compounding over time. Halving growth lowers year-10 revenue by only ~35%, and FCF by a similar or smaller amount.\nSimilar question: 9% → 10% growth vs. 9% → 10% discount rate → the discount rate wins easily. 9% → 20% growth vs. a +1% rate → you'd have to run the numbers.", "tip": null}, {"id": "dcf-d74daee8", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "The corporate tax rate falls from 35% to 20%. What happens to WACC and the DCF value?", "a": "FCF rises (lower taxes), which is the bigger effect.\nWACC rises slightly if the company has debt: a smaller interest tax shield raises the after-tax Cost of Debt, and the re-levered beta (via 1 − t) rises.\nNet: value goes UP. With no debt, WACC is unchanged and value definitely rises.", "tip": null}, {"id": "dcf-ed01fc41", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Your VP extends a 10-year DCF for a growth tech company to 20 years. What changes?", "a": "The TV's share of value falls (e.g., 70% → 50%), and more value comes from explicit cash flows. Whether the total goes up or down depends on the numbers. It's often more reasonable for companies far from maturity.", "tip": null}, {"id": "dcf-bc0a0640", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Same company profile in an emerging vs. a developed market: whose DCF value is higher?", "a": "The developed-market company's. The EM company carries higher sovereign, equity, and credit risk → a higher discount rate → a lower value (given the same financial profile).", "tip": null}, {"id": "dcf-76815142", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "Two companies have equal total 10-year FCF. A gets 90% in year 1, and B is even every year. Whose DCF value is higher?", "a": "Explicit cash flows alone: A (money sooner).\nBut B has far higher year-10 FCF → a much larger Terminal Value. So B's total DCF value is almost certainly higher.", "tip": null}, {"id": "dcf-6c78d11c", "m": "dcf", "t": "qa", "f": 2, "c": true, "q": "Which assumptions drive a DCF the most? What would you sensitize?", "a": "The discount rate and the terminal value (growth rate or exit multiple). Then the operating drivers: revenue growth and margins. CapEx and working capital usually matter far less.\nTypical sensitivity tables: WACC × terminal growth (or multiple), and growth × margin. Add industry-specific ones (e.g., the patent expiry date in pharma).", "tip": null}, {"id": "dcf-266e73e2", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "What is the mid-year convention, and what does it do to value?", "a": "Cash arrives throughout the year, not on Dec 31, so discount at periods 0.5, 1.5, 2.5… instead of 1, 2, 3.\nShorter discount periods → higher implied value.", "tip": null}, {"id": "dcf-fac1265a", "m": "dcf", "t": "qa", "f": 2, "c": false, "q": "What is a stub period?", "a": "Valuing mid-year: drop the cash flow already earned this year and discount the remainder over a partial period.\nValuing on Sept 30 with a Dec FYE: include only Q4 FCF at period 0.25, then 1.25, 2.25…", "tip": null}, {"id": "dcf-2ed4c21b", "m": "dcf", "t": "drill", "f": 1, "c": false, "q": "Valuing on April 30 with a stub period AND the mid-year convention. Which discount periods? How is the TV discounted?", "a": "Stub (May to Dec) = 0.67 of a year → mid-year: 0.67 / 2 ≈ 0.33.\nNext years: 1.67 − 0.5 = 1.17, then 2.17…\n10-year forecast. Exit-multiple TV (as of year-end): 9.67. Gordon TV with mid-year flows: 9.17.", "tip": null}, {"id": "dcf-315141e4", "m": "dcf", "t": "qa", "f": 1, "c": false, "q": "What's a \"normalized terminal year\"?", "a": "A clean extra year used for the TV when the final forecast year isn't representative: a patent cliff, intangibles finishing amortization, abnormal margins or CapEx. It usually LOWERS value (it strips out temporary boosts).", "tip": null}, {"id": "dcf-39bbadff", "m": "dcf", "t": "qa", "f": 1, "c": false, "q": "Do you include out-of-the-money options in a DCF's share count?", "a": "In theory, you'd value them (e.g., Black-Scholes) and subtract. In practice, banks usually ignore them. The impact is small and the inputs are fuzzy.", "tip": null}, {"id": "dcf-01689e91", "m": "dcf", "t": "drill", "f": 2, "c": true, "q": "Quick PV check: $110 arrives in 1 year, discount rate 10%. PV? And $121 in 2 years?", "a": "$110 / 1.10 = $100.\n$121 / 1.10² = $121 / 1.21 = $100.", "tip": "Know that 1.1² = 1.21 and 1.1³ ≈ 1.33 by heart."}, {"id": "dcf-79e938ab", "m": "dcf", "t": "drill", "f": 2, "c": true, "q": "Terminal Value: final-year FCF $100, g = 2%, WACC = 10%. TV? What implied value if EBITDA that year was $150?", "a": "TV = 100 × 1.02 / (10% − 2%) = 102 / 0.08 = $1,275.\nImplied multiple = 1,275 / 150 = 8.5x EBITDA.", "tip": null}, {"id": "dcf-3920a369", "m": "dcf", "t": "drill", "f": 2, "c": true, "q": "Cost of Equity: Rf 4%, ERP 6%, levered beta 1.25. What is it? Then WACC with 75% equity / 25% debt, a 6% pre-tax cost of debt, and a 25% tax rate?", "a": "Ke = 4% + 1.25 × 6% = 11.5%.\nAfter-tax Kd = 6% × 0.75 = 4.5%.\nWACC = 0.75 × 11.5% + 0.25 × 4.5% = 8.625% + 1.125% = 9.75%.", "tip": null}, {"id": "dcf-00fe30c7", "m": "dcf", "t": "drill", "f": 1, "c": false, "q": "A peer's levered beta is 1.2, D/E 0.5, tax 25%, no preferred. Unlevered beta? Re-lever at D/E = 1.0.", "a": "βu = 1.2 / (1 + 0.5 × 0.75) = 1.2 / 1.375 ≈ 0.87.\nβL = 0.87 × (1 + 1.0 × 0.75) = 0.87 × 1.75 ≈ 1.53.", "tip": null}, {"id": "ma-5cbc8aa7", "m": "ma", "t": "qa", "f": 3, "c": true, "q": "Why would one company buy another?", "a": "Because it expects to be better off: the seller's price is below its implied value, or the deal's IRR beats the buyer's discount rate.\nTypical strategic reasons: scale and cost savings (consolidation), new geographies or market share, new customers or distribution channels, new products, IP, or talent, and synergies (lower combined costs, cross-selling).", "tip": null}, {"id": "ma-f61d9bd8", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "How do you judge whether an M&A deal makes sense?", "a": "Qualitative: does it add geography, products, customers, IP, or talent? Does it fit culturally?\nQuantitative: value the seller (is it cheap vs. intrinsic value?), compare the deal's IRR with the buyer's discount rate, and run EPS accretion/dilution. Boards and investors strongly prefer accretive deals.", "tip": null}, {"id": "ma-a8050d05", "m": "ma", "t": "walk", "f": 3, "c": true, "q": "Walk me through a merger model.", "a": "1. Project both companies' financials (mainly the Income Statements).\n2. Set the purchase price and the funding mix: cash, debt, stock.\n3. Build Sources & Uses and the Purchase Price Allocation (goodwill, write-ups, new DTLs).\n4. Combine the Balance Sheets: cash used, debt raised, stock issued, goodwill, and the seller's equity written off.\n5. Combine the Income Statements, adjusting for foregone interest on cash, interest on new debt, synergies, and new D&A.\n6. Combined NI = combined pre-tax income × (1 − buyer's tax rate). Combined EPS = NI / (buyer's shares + new shares).\n7. Accretion/dilution = combined EPS / buyer's standalone EPS − 1.", "tip": null}, {"id": "ma-09b0fb6a", "m": "ma", "t": "qa", "f": 3, "c": true, "q": "Why is a deal accretive or dilutive?", "a": "Accretive if the seller's added pre-tax income is more than what the deal costs: foregone interest on cash, interest on new debt, and the earnings dilution from new shares.\nSeller adds $100 of pre-tax income, new interest costs $70, no new shares → accretive. New interest costs $130 → dilutive.", "tip": null}, {"id": "ma-6d6ac9cf", "m": "ma", "t": "concept", "f": 3, "c": true, "q": "The quick test for accretion vs. dilution", "a": "Compare the weighted after-tax cost of the funding with the seller's yield.\n• Cost of cash = foregone interest rate × (1 − t)\n• Cost of debt = new debt rate × (1 − t)\n• Cost of stock = buyer's NI / buyer's Equity Value = 1 / buyer's P/E\n• Seller yield = seller NI / purchase Equity Value = 1 / purchase P/E\nWeighted cost < seller yield → accretive. Weighted cost > seller yield → dilutive.", "tip": null}, {"id": "ma-12d20a25", "m": "ma", "t": "qa", "f": 3, "c": true, "q": "Shortcut for a 100% stock deal?", "a": "Compare P/E multiples. Buyer's P/E > seller's purchase P/E → accretive. Buyer's P/E < seller's → dilutive.\nIt works because the reciprocals ARE the cost of stock and the seller yield.", "tip": "Without \"100% stock,\" you can't tell from the P/Es alone. Say so."}, {"id": "ma-fec47a07", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "Why focus so much on EPS in M&A?", "a": "It's the only easy metric that captures the WHOLE deal: foregone interest, new interest, and new shares. EBITDA or UFCF show business value but ignore how the deal was financed.", "tip": null}, {"id": "ma-66f3b579", "m": "ma", "t": "qa", "f": 3, "c": true, "q": "How do you set the purchase price?", "a": "Public seller: a premium to the current share price, often 10 to 30% based on comparable deals, cross-checked with a DCF and comps.\nPrivate seller: a multiple of EBITDA, EBIT, or revenue from the standard valuation methods.\nBigger expected synergies → buyers can justify a larger premium (if the PV of the synergies is greater than the premium).", "tip": null}, {"id": "ma-8836b755", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "What's the \"true price\" in M&A: purchase Equity Value or EV?", "a": "Purchase EV (or close to it). That's what the buyer pays ALL of the seller's investors for the core business.\nBut models usually key off purchase Equity Value: it's what the selling shareholders receive and what the cash, debt, and stock must fund. The seller's existing debt and cash mostly wash out in the combined P&L (debt is refinanced, excess cash lowers the effective price).", "tip": null}, {"id": "ma-44f6c095", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "Cash vs. debt vs. stock as acquisition currency: pros and cons", "a": "Cash: cheapest (it usually earns little interest), fast and simple, but it drains flexibility.\nDebt: middle cost, slower to raise (it has to be marketed), and it limits future borrowing capacity.\nStock: usually the most expensive and dilutes existing owners, but there's no cash cost. It can be \"cheap\" if the buyer trades at a very high P/E, and it can sometimes be issued quickly.\nTaxes: seller shareholders defer tax with stock but pay capital gains tax right away on cash.", "tip": null}, {"id": "ma-931ece9d", "m": "ma", "t": "qa", "f": 3, "c": true, "q": "How does a buyer decide on the funding mix?", "a": "Cheapest first:\n1. Cash above its minimum cash balance.\n2. Debt up to a leverage level in line with peers (e.g., from 2x to 4 to 5x Debt / EBITDA, possibly counting the target's EBITDA).\n3. Stock for the rest, limited by control concerns and the point where the deal turns dilutive.", "tip": null}, {"id": "ma-ffbc3d5a", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "Which form of payment does a seller prefer?", "a": "A trade-off between tax and certainty.\nCash/debt-funded cash: certain value now, taxed now, and no upside if the buyer's stock rises (but no downside either).\nStock: tax deferred, and it shares in the combined company's upside or downside.\nUncertain or riskier buyer → cash. Large, stable buyer → stock may appeal.", "tip": null}, {"id": "ma-d9752309", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "Isn't foregone interest on cash just an \"opportunity cost\"? Why include it?", "a": "It's a real hit to earnings. The buyer's projected pre-tax income already counts interest income on that cash. Spend the cash, and that income disappears from the combined P&L.", "tip": null}, {"id": "ma-568dd29a", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "Cost of stock = 1 / P/E? Doesn't that contradict CAPM?", "a": "No, they measure different things. 1 / P/E captures the EPS impact of issuing shares. CAPM captures the long-run return shareholders expect. Each fits its own context, and stock is usually the most expensive source either way.", "tip": null}, {"id": "ma-f45999b2", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "Why use stock or debt if the buyer could pay all cash?", "a": "Cash may be trapped overseas or restricted, earmarked for upcoming CapEx or debt maturities, or the buyer's very high P/E may make stock the cheapest currency on paper.", "tip": null}, {"id": "ma-632ae80a", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "When doesn't accretion/dilution matter, and what else would you look at?", "a": "It matters less when the buyer is private, has negative EPS, or is 10 to 100x the seller's size.\nOther tests: strategic merits, deal IRR vs. discount rate, seller value + PV of synergies vs. price paid, contribution analysis (for stock deals), and value creation analysis.", "tip": null}, {"id": "ma-b074f6d5", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "Merger vs. acquisition: what's the difference?", "a": "Mechanically, none. There's always a buyer and a seller. A \"merger\" just means the companies are closer in size, usually funded mostly with stock, so contribution and value creation analyses carry more weight.", "tip": null}, {"id": "ma-4aaf6400", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "What are the main limitations of merger models?", "a": "• EPS isn't always meaningful, and EPS ≠ cash flow or value.\n• All-cash deals almost always look accretive, even risky ones.\n• They ignore integration, legal, customer, and culture risk.\n• Share prices can move a lot before closing.\n• Qualitative fit isn't captured.", "tip": null}, {"id": "ma-2cf574c3", "m": "ma", "t": "walk", "f": 2, "c": true, "q": "Walk me through a sell-side M&A process.", "a": "1. Kick off with the client. Prepare a teaser, a CIM/offering memo, and a model, and build the buyer list (strategic and financial buyers).\n2. Send teasers, sign NDAs, share the CIM.\n3. First-round bids: indications of interest (IOIs) → narrow the field.\n4. Second round: management meetings, data room diligence → final bids.\n5. Pick the winner, negotiate the purchase agreement, sign and announce, then close (regulatory and shareholder approvals).\nBankers add value through price, terms, and creating competitive tension.", "tip": null}, {"id": "ma-db9995ec", "m": "ma", "t": "drill", "f": 3, "c": true, "q": "Buyer: 10 shares at $25, NI $10. It buys the seller for $150 of purchase equity (seller NI $10) in 100% stock. Same tax rates. Accretion?", "a": "Buyer EPS = $1.00. New shares = 150 / 25 = 6 → 16 total.\nCombined NI = 10 + 10 = $20 → EPS = $1.25 → 25% accretive.", "tip": "Check: buyer P/E 25x > seller purchase P/E 15x → accretive."}, {"id": "ma-18951d37", "m": "ma", "t": "drill", "f": 2, "c": true, "q": "Same deal funded with 8% debt (25% tax). Still accretive? At what rate does it break even?", "a": "After-tax cost = 8% × 0.75 = 6%. Seller yield = 10 / 150 ≈ 6.7% → still accretive.\nBreakeven: 6.67% / 0.75 ≈ 8.9% pre-tax. At or above that, it turns dilutive.", "tip": null}, {"id": "ma-aed8e2fe", "m": "ma", "t": "drill", "f": 2, "c": false, "q": "Now the buyer is twice as big: $500 Equity Value (10 shares at $50), NI $20. Same $150, 100% stock deal. More or less accretive?", "a": "Less accretive (the seller is a smaller piece of the combined company).\nNew shares = 3 → 13. Combined NI = $30 → EPS ≈ $2.31 vs. $2.00 → ~15% accretive (vs. 25% before).", "tip": null}, {"id": "ma-7cfa9c6a", "m": "ma", "t": "drill", "f": 3, "c": true, "q": "Buyer P/E 10x, debt at 8%, cash yield 4%, tax 25%. It buys a target at 16x P/E using 1/3 each cash, debt, and stock. Accretive?", "a": "Costs: stock 10%, debt 6%, cash 3% → weighted = (10 + 6 + 3) / 3 ≈ 6.33%.\nSeller yield = 1 / 16 = 6.25%.\n6.33% > 6.25% → slightly dilutive.", "tip": null}, {"id": "ma-9d15bcbb", "m": "ma", "t": "drill", "f": 2, "c": true, "q": "100% debt deal: buyer P/E 15x, seller purchase P/E 12x, tax 25%. What interest rate makes it dilutive?", "a": "Seller yield = 1 / 12 ≈ 8.3%. Dilutive when the after-tax cost of debt > 8.3% → pre-tax > 8.3% / 0.75 ≈ 11.1%.\nFew companies pay 11%, so a debt-funded version is very likely accretive.", "tip": "The buyer's P/E is irrelevant in an all-debt deal."}, {"id": "ma-c96902e1", "m": "ma", "t": "drill", "f": 2, "c": true, "q": "Buyer: Equity Value $1,000, NI $100. Seller: purchase Equity Value $2,000, NI $50. All stock. What synergies are needed to break even?", "a": "Cost of stock = 10%. Seller yield = 2.5% → very dilutive.\nFor a ≥10% yield, the seller needs NI ≥ $200 → $150 of after-tax synergies → $150 / 0.75 = $200 pre-tax.", "tip": null}, {"id": "ma-90e11aa0", "m": "ma", "t": "drill", "f": 1, "c": false, "q": "Buyer: Equity Value $1B, cash $50M, EBITDA $100M, NI $50M, Debt / EBITDA 2x (peers at 4x). Target: $500M purchase equity, EBITDA $50M, no debt. How should it fund the deal?", "a": "Cash: $50M is probably near its minimum → little or none.\nDebt: combined EBITDA $150M × 4x = $600M capacity − $200M existing = ~$400M of new debt.\nStock: the remaining ~$100M (less if some cash is used).", "tip": null}, {"id": "ma-3b972eea", "m": "ma", "t": "drill", "f": 3, "c": true, "q": "Buyer: Equity Value $500M, EV $600M. Target: purchase Equity Value $100M, purchase EV $150M. Combined Equity Value and EV?", "a": "Combined EV = 600 + 150 = $750M, regardless of financing.\nCombined Equity Value = buyer's Equity Value + stock issued:\n100% stock → $600M. 100% cash or debt → $500M. A mix → in between.", "tip": null}, {"id": "ma-83749cd6", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "\"In an all-cash deal, the seller's Equity Value just disappears?\"", "a": "No. It's converted into the cash or debt the buyer used. Combined EV still includes both businesses, so no value is lost.", "tip": null}, {"id": "ma-24181ea0", "m": "ma", "t": "drill", "f": 2, "c": false, "q": "Same buyer ($500M equity, 100M shares at $5). It pays a 30% premium in stock for a $100M equity / $150M EV target. Later, the market decides the premium wasn't worth it. Before and after?", "a": "At announcement: Equity Value = 500 + 130 = $630M. EV = 600 + 180 = $780M.\nPremium rejected: the buyer's value falls by $30M → $4.70 per share. Equity Value $600M, EV $750M.\nAll cash or debt instead: Equity Value $500M → $470M. EV moves the same way, $780M → $750M.", "tip": null}, {"id": "ma-746dbece", "m": "ma", "t": "drill", "f": 2, "c": true, "q": "Buyer: Equity Value $500M / EV $600M, NI $50M, EBITDA $100M. Target: $100M purchase equity / $150M purchase EV, NI $10M, EBITDA $15M. Combined P/E and TEV/EBITDA in a 100% stock deal?", "a": "Equity Value 600 / NI 60 → P/E = 10x.\nEV 750 / EBITDA 115 → ≈ 6.5x.", "tip": null}, {"id": "ma-066411ac", "m": "ma", "t": "drill", "f": 2, "c": false, "q": "Same deal, but 100% debt at 8% (25% tax). Combined multiples?", "a": "TEV/EBITDA: unchanged at ≈ 6.5x (financing doesn't touch EV or EBITDA).\nNI = 50 + 10 − 100 × 8% × 0.75 = $54M. Equity Value = $500M → P/E ≈ 9.3x.", "tip": null}, {"id": "ma-3c61b015", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "How do the combined multiples behave?", "a": "EV-based multiples: unaffected by financing, and always between the buyer's multiple and the seller's PURCHASE multiple.\nEquity-based multiples: change with the financing (stock issued, interest effects). Usually in that range, but not guaranteed.\nThey lean toward the larger company. You can't just average them.", "tip": null}, {"id": "ma-7dcbfec1", "m": "ma", "t": "drill", "f": 1, "c": false, "q": "A: EV $100, Equity $80, EBITDA $10, NI $4. B: EV $40, Equity $40, EBITDA $8, NI $2. 50% tax. A buys B for cash at no premium (5% foregone interest). Combined multiples? With 10% debt instead?", "a": "Standalone: A is 10x EBITDA / 20x P/E. B is 5x / 20x.\nCombined TEV/EBITDA = 140 / 18 ≈ 7.8x (either way).\nCash: NI = 6 − 40 × 5% × 0.5 = $5 → P/E 80 / 5 = 16x (below both companies' 20x).\nDebt: NI = 6 − 40 × 10% × 0.5 = $4 → P/E = 20x.", "tip": null}, {"id": "ma-70d2080a", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "What does a Purchase Price Allocation do?", "a": "Works out the goodwill. Purchase Equity Value is almost always above the seller's book equity. Once the seller's equity is written off, the Balance Sheet won't balance, so you write up assets (PP&E, intangibles), record any new DTL, and goodwill plugs the rest.", "tip": null}, {"id": "ma-0fe153f0", "m": "ma", "t": "drill", "f": 2, "c": true, "q": "$1B equity purchase price. Target equity $600M, no existing goodwill. PP&E and intangibles written up by $100M. 25% tax. Goodwill?", "a": "Premium = 1,000 − 600 = $400M.\n− $100M of write-ups → $300M.\n+ new DTL = 100 × 25% = $25M (an extra liability means more goodwill is needed).\nGoodwill = $325M.", "tip": null}, {"id": "ma-7183a961", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "Why do M&A deals create Deferred Tax Liabilities?", "a": "In a typical stock purchase, the D&A on asset write-ups is book-only, with no tax deduction. So the combined company will pay MORE cash tax than book tax until the write-ups are used up. That future extra tax is a DTL (write-up × tax rate), and it unwinds over time.", "tip": null}, {"id": "ma-7b1c1512", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "What if you pay $1B for a target with $1.5B of book equity?", "a": "Negative goodwill isn't allowed. Record the $500M as a gain (bargain purchase) on the IS, reverse it on the CFS as non-cash, and adjust deferred taxes. Combine everything else normally, with no goodwill created.", "tip": null}, {"id": "ma-b6a66bfc", "m": "ma", "t": "qa", "f": 2, "c": false, "q": "What are the main Balance Sheet adjustments in an M&A deal?", "a": "Cash used, new debt (net of financing fees), stock issued, assumed or refinanced seller debt. New goodwill, asset write-ups, new DTLs, existing DTAs/DTLs written off. The seller's equity written off, and transaction fees out of equity. Sometimes intercompany AR/AP is eliminated.", "tip": null}, {"id": "ma-ec8af6ee", "m": "ma", "t": "qa", "f": 2, "c": true, "q": "Give examples of revenue and cost synergies, and explain why models overstate them.", "a": "Revenue: cross-sell to the buyer's base, e.g., 1,000 of 100K customers buy a $10 widget = $10K of revenue, but only ~$5K of profit after COGS.\nCost: close redundant offices, cut duplicate back office (IT, HR, finance). E.g., 2 offices × $100K = $200K.\nOverstated because models skip the costs that come with revenue synergies, assume full run-rate in year 1, and ignore integration and severance costs.", "tip": null}, {"id": "ma-837e533c", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "How do you treat SBC in a merger model?", "a": "As a real (cash-like) operating expense. Leave it in the IS and don't add it back. That captures the cost and keeps the standalone share counts stable, without forecasting dilution.", "tip": null}, {"id": "ma-539c3293", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "Why check Debt / EBITDA and EBITDA / Interest for the combined company?", "a": "To see whether the buyer can take on more debt or is overloading itself. Look at the path, not just closing day: 5 to 6x at close may be fine if cash flow brings it down to 2 to 3x within a few years.", "tip": null}, {"id": "ma-aa8f6062", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "What is pro-forma (adjusted) EPS accretion, and why be skeptical?", "a": "Companies add back deal-created non-cash charges (intangible amortization, write-up D&A) and often \"one-time\" integration costs. It flatters the deal and understates its real costs.", "tip": null}, {"id": "ma-9f49fc32", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "What is a contribution analysis?", "a": "For stock deals: each side's % of combined revenue, EBITDA, NI vs. its % ownership. E.g., the buyer's EV is $1,500 and it contributes 75% of revenue → implied combined EV $2,000 → the seller is worth ~$500 → bridge → implied offer price per share. Compare that with the actual offer.", "tip": null}, {"id": "ma-a46dacaa", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "What is a value creation analysis, and when is it relevant?", "a": "Assume the combined company re-rates to bigger peers' multiples → new EV → bridge → ÷ (buyer shares + new shares). If that beats the buyer's standalone share price, the deal \"created value.\" Speculative. Most relevant when #2 and #3 combine to take on #1.", "tip": null}, {"id": "ma-b5c7578a", "m": "ma", "t": "qa", "f": 1, "c": false, "q": "What's different in a cash-free, debt-free deal?", "a": "Used for private sellers. The seller's cash and debt are effectively zeroed at close: excess cash pays down debt or goes to the owners, and leftover debt reduces their proceeds. Price is set on EV (a multiple of EBITDA). Uses = purchase EV + minimum cash + fees. Economically the same as a standard deal, just presented differently.", "tip": null}, {"id": "lbo-70daec76", "m": "lbo", "t": "qa", "f": 3, "c": true, "q": "What is a leveraged buyout, and why does it work?", "a": "A PE firm buys a company with a mix of debt and its own equity, runs it for ~3 to 7 years using the company's cash flow to pay interest and repay debt, then sells it.\nIt works because leverage AMPLIFIES returns: less equity upfront means a bigger percentage gain if the deal goes well. It also amplifies losses if it doesn't.", "tip": null}, {"id": "lbo-718f2963", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "Why do PE firms use leverage? Doesn't it \"increase returns\"?", "a": "It amplifies them in both directions: good outcomes get better, bad ones get worse. Firms need to clear a target IRR, and leverage makes that easier when things go right.\nBonus: less equity per deal leaves more of the fund available for other deals.", "tip": null}, {"id": "lbo-010f1d02", "m": "lbo", "t": "walk", "f": 3, "c": true, "q": "Walk me through a basic LBO model.", "a": "1. Assumptions: purchase price (multiple), debt vs. equity mix, interest rates, operating drivers (growth, margins).\n2. Sources & Uses → the investor equity required (after fees, cash, refinancing).\n3. Project the IS and a partial CFS down to free cash flow (FCF is after interest here).\n4. Debt schedule: cash available for repayment = beginning cash + FCF − minimum cash − mandatory paydown → optional paydown. Interest is linked to the declining balances.\n5. Exit: assume an EBITDA exit multiple → exit EV − net debt = equity proceeds → IRR and multiple of money vs. the original equity.", "tip": null}, {"id": "lbo-20de2376", "m": "lbo", "t": "concept", "f": 3, "c": true, "q": "The IRR rules of thumb to memorize", "a": "2x in 3 years ≈ 25%\n2x in 5 years ≈ 15%\n3x in 3 years ≈ 45%\n3x in 5 years ≈ 25%\nIn between? Interpolate: 2.5x in 5 years ≈ 20%.\nExact: IRR = (proceeds / equity)^(1/years) − 1 (with no interim cash flows).", "tip": null}, {"id": "lbo-cc8a87d1", "m": "lbo", "t": "drill", "f": 3, "c": true, "q": "Buy a $100M EBITDA company at 10x with 60% debt. EBITDA grows to $150M by year 5, and the exit multiple drops to 9x. $250M of debt repaid, no extra cash. IRR?", "a": "EV in = $1,000M → equity $400M, debt $600M.\nExit EV = 150 × 9 = $1,350M. Debt left = 600 − 250 = $350M.\nProceeds = $1,000M → 2.5x in 5 years ≈ 20% IRR.", "tip": null}, {"id": "lbo-1bb01489", "m": "lbo", "t": "drill", "f": 2, "c": true, "q": "$200M EBITDA bought at 6x with 50% debt. EBITDA reaches $300M in year 3, same exit multiple, no extra cash. What's the minimum IRR? The maximum (if all debt is repaid)?", "a": "EV in = $1,200M → $600M equity / $600M debt. Exit EV = $1,800M.\nMinimum (no paydown): 1,800 − 600 = $1,200M → 2x in 3 years ≈ 25%.\nMaximum (all repaid): $1,800M → 3x in 3 years ≈ 45%.", "tip": null}, {"id": "lbo-f1c6c55d", "m": "lbo", "t": "drill", "f": 2, "c": true, "q": "Buy a $100 EBITDA business at 10x, sell at 10x in 5 years, 5x debt, half of it repaid. What EBITDA growth do you need for a 20% IRR?", "a": "20% over 5 years ≈ 2.5x. Equity $500 → you need $1,250 back.\nDebt left = $250 → exit EV needed = $1,500 → EBITDA of $150 at 10x.\nSo EBITDA has to grow 50% (≈ 8.4% a year).", "tip": null}, {"id": "lbo-573550b5", "m": "lbo", "t": "drill", "f": 3, "c": true, "q": "12x purchase, 5x debt, EBITDA $100 → $200 in 5 years, no paydown. What exit multiple gives a 25% IRR? What if 75% of the debt is repaid?", "a": "EV in = $1,200 → debt $500, equity $700. 25% over 5 years ≈ 3x → $2,100 needed.\nNo paydown: exit EV = 2,100 + 500 = $2,600 → 13x.\n75% repaid (debt left $125): 2,100 + 125 = $2,225 → ~11.1x.", "tip": null}, {"id": "lbo-562999fd", "m": "lbo", "t": "drill", "f": 2, "c": true, "q": "10x purchase, 5x debt, 5-year IRR is 20%, EBITDA $100 → $150, exit at 11x. How much debt was repaid?", "a": "2.5x on $500 of equity = $1,250 of proceeds.\nExit EV = 150 × 11 = $1,650 → net debt at exit = $400.\nStarted with $500 → ~$100 repaid (with cash flat).", "tip": null}, {"id": "lbo-48250066", "m": "lbo", "t": "drill", "f": 2, "c": false, "q": "10x purchase, 6x debt, EBITDA $100 → $150, ~$300 of debt repaid. What exit multiple for a 25% 5-year IRR?", "a": "Equity $400 → need 3x = $1,200. Debt left $300 → exit EV $1,500 → 10x, the same as the entry multiple.", "tip": null}, {"id": "lbo-29f68926", "m": "lbo", "t": "drill", "f": 2, "c": false, "q": "$200 EBITDA bought at 8x with 50% debt. EBITDA → $240, all debt repaid in 3 years, then an IPO with the stake sold evenly in years 3 to 5 at 10x. Approximate IRR?", "a": "Equity = $800. Proceeds = 240 × 10 = $2,400 → 3x.\nAverage exit year ≈ 4 → between 3x in 3 years (45%) and 3x in 5 years (25%) → ~35% (it's actually ~32%).", "tip": "IPO exits spread out the timing. Use the average exit year."}, {"id": "lbo-143d563d", "m": "lbo", "t": "drill", "f": 2, "c": false, "q": "$500 of equity in, a $250 dividend in year 2, $1,000 of exit proceeds in year 3. Approximate IRR?", "a": "Total back = $1,250 → 2.5x. \"2.5x in 3 years\" would be ~35%, but part of the cash came early → a bit higher: ~35 to 40% (Excel: ~39%).", "tip": null}, {"id": "lbo-1cb840af", "m": "lbo", "t": "drill", "f": 2, "c": false, "q": "$500 of equity. Normally $1,200 at the year-5 exit, but the firm does a $400 dividend recap in year 3. Effect?", "a": "Without it: 2.4x over 5 years → just under 20% (~19%).\nWith it: still 2.4x total, but a third arrives in year 3 → average exit year ≈ 4 → ~23%.\nA recap barely changes the multiple, but the IRR rises because the money comes back sooner.", "tip": null}, {"id": "lbo-6f47dd2a", "m": "lbo", "t": "drill", "f": 2, "c": false, "q": "Can a PE firm earn 20% if it buys for $1B of EV and sells for $1B of EV after 5 years?", "a": "Yes, through leverage and paydown. A 20% IRR over 5 years ≈ 2.5x. Fund it with $400M of equity + $600M of debt, repay ALL the debt, and the $1B exit goes entirely to equity → 2.5x.", "tip": null}, {"id": "lbo-471a5f72", "m": "lbo", "t": "drill", "f": 1, "c": false, "q": "$100 → $150 of EBITDA over 7 years, exit at 10x, $500 of debt in and $300 of net debt at exit, IRR ≈ 10%. What was the purchase multiple?", "a": "Proceeds = 1,500 − 300 = $1,200. 10% over 7 years ≈ 2x (1.1⁷ ≈ 1.95) → equity in ≈ $600.\nEV in = 600 + 500 = $1,100 → 11x.", "tip": null}, {"id": "lbo-e8d501d2", "m": "lbo", "t": "qa", "f": 3, "c": true, "q": "Which assumptions matter most in an LBO?", "a": "1. The purchase and exit multiples (pay less, sell for more).\n2. Leverage: more debt magnifies results either way.\n3. Operations: revenue growth, margins, cash conversion (they drive exit EBITDA and debt paydown).\n4. Debt terms (rates, amortization) matter, but much less.", "tip": null}, {"id": "lbo-5b9ca154", "m": "lbo", "t": "qa", "f": 3, "c": true, "q": "How can a PE firm boost returns? What are the three return drivers?", "a": "• Multiple expansion: buy cheaper or exit higher (better growth or ROIC, good market timing).\n• EBITDA growth: grow revenue and expand margins.\n• Debt paydown / cash generation: boost FCF (cut CapEx and working capital, run efficiently), or use more debt if the company can handle it.", "tip": "Good deals rely on growth and paydown, not just hoping the multiple expands."}, {"id": "lbo-a1ee76de", "m": "lbo", "t": "qa", "f": 3, "c": true, "q": "What makes an ideal LBO candidate?", "a": "At the right price, almost anything works. Ideally:\n• Stable, predictable cash flow (to service debt)\n• Modest CapEx and reinvestment needs\n• A fragmented industry (room for add-on acquisitions)\n• Room to cut costs or improve margins\n• Strong management\n• Hard assets to use as collateral\n• Realistic exits, with returns from multiple sources", "tip": null}, {"id": "lbo-b80e73e7", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "How do you pick the purchase and exit multiples?", "a": "Purchase: for a public company, a premium to the share price (e.g., 30%), then check the implied EBITDA multiple against comps and precedents. For a private one, valuation methods directly.\nExit: often ≈ the purchase multiple. Justify any change with the growth, margins, or ROIC at exit, and run sensitivities.", "tip": null}, {"id": "lbo-d1a10300", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "How do you use an LBO to value a company? Why is it a \"floor\"?", "a": "Set a target IRR (e.g., 20 to 25%) and solve (goal seek) for the maximum price.\nE.g., if a 25% 5-year IRR lets you put in $328 of equity at 50/50 debt and equity → ~$656 of EV.\nIt's a floor because it's the most a return-constrained financial buyer can pay. Strategic buyers with synergies can usually pay more.", "tip": null}, {"id": "lbo-9c5e1935", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "LBO valuation vs. DCF: aren't they both cash-flow based?", "a": "Both use cash flow, but they ask different questions.\nDCF: what's the company worth, based on all its future cash flows?\nLBO: what's the MOST we can pay and still hit a 20 to 25% IRR in ~5 years?", "tip": null}, {"id": "lbo-78785cf9", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "How is an LBO different from a regular M&A deal?", "a": "• A planned exit in 3 to 7 years, so IRR and the multiple of money are what matter.\n• Funding is just debt + the sponsor's cash equity (no stock of an acquirer).\n• No synergies or EPS accretion to speak of.\n• The price may be backed into from a target IRR.\n• The debt sits on the acquired company, not the buyer.", "tip": null}, {"id": "lbo-f7f84486", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "Strategic buyers prefer cash. Why do PE firms load up on debt?", "a": "They're exiting in a few years, so they care about amplifying returns on a small equity check more than the ongoing cost of debt. And the target company owes the debt (held at a holding company, non-recourse to the fund), so the risk falls on the business, not the sponsor.", "tip": null}, {"id": "lbo-4738c13d", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "Explain the legal structure of an LBO.", "a": "The PE firm forms a holding company (holdco). The holdco borrows and buys the target. Lenders and management rollover sit at that level. The fund isn't on the hook for the debt. The acquired company services it. So the firm effectively borrows \"against the company.\"", "tip": null}, {"id": "lbo-3a23297e", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "What goes into a Sources & Uses table, and what's the \"real\" price?", "a": "Uses: purchase equity (buying out the shares), refinancing existing debt, fees (advisory and financing), and sometimes minimum cash to fund.\nSources: new debt tranches, company cash used, management rollover, and the PE firm's equity (the plug).\nEV is the true price economically. From the sponsor's seat, the equity check is \"what they pay.\"", "tip": null}, {"id": "lbo-cec3a2d9", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "How do fees show up in an LBO?", "a": "Paid upfront in cash, which raises the equity needed.\nAdvisory and legal fees → reduce cash and equity.\nFinancing fees → reduce cash and are netted against the debt's book value, then amortized (interest is still paid on face value, e.g., $100 of debt with $3 of fees).", "tip": null}, {"id": "lbo-2ffc9fc3", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "How does a management rollover affect Sources & Uses?", "a": "It's a source of funds. Management keeps (rolls) shares instead of cashing out, so the sponsor buys less: roll 10M of 50M shares and the PE firm buys 40M. The sponsor's ownership is lower accordingly.", "tip": null}, {"id": "lbo-bb5719f7", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "How do you size the debt and the number of tranches?", "a": "Look at recent comparable LBOs (e.g., median 5x Debt / EBITDA: 2x term loans + 3x notes) and leveraged peers. Then stress-test leverage and coverage over the projections (e.g., keep EBITDA / interest above ~2x) and adjust.", "tip": null}, {"id": "lbo-776e4c62", "m": "lbo", "t": "qa", "f": 3, "c": true, "q": "What types of debt are used in an LBO?", "a": "Secured / senior (bank debt): revolver and term loans. Backed by collateral, lower floating rates, amortization, maintenance covenants (e.g., max Debt / EBITDA), early repayment allowed, ~5 to 7 year terms, conservative bank lenders.\nUnsecured / junior (high-yield): senior and subordinated notes, mezzanine. No collateral, higher (often fixed) rates, no amortization, incurrence covenants, early repayment restricted (call premiums), 8 to 10+ years, hedge-fund and mezzanine-fund investors.", "tip": null}, {"id": "lbo-38208398", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "Why does the SAFER debt amortize?", "a": "Amortization lowers lenders' risk but ALSO their total return (less principal outstanding earns interest for less time, plus reinvestment risk). Lower risk ↔ lower return, so it belongs on the conservative, lower-yield tranches.", "tip": null}, {"id": "lbo-b1829180", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "Term loans vs. subordinated notes: when would you choose each?", "a": "Term loans: cheaper, allow prepayment, and their maintenance covenants won't block asset sales, M&A, or big CapEx the way note incurrence covenants can.\nSub notes: when the company might trip maintenance covenants (EBITDA dipping), or to use PIK interest that accrues instead of being paid in cash.", "tip": null}, {"id": "lbo-04fcc1ec", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "How do you use a revolver in an LBO model?", "a": "Draw on it when cash available (beginning cash + FCF − minimum cash − mandatory repayments) goes negative. Repay it as soon as cash allows.\nE.g., beginning cash 50 + FCF 75 − minimum cash 100 − mandatory 100 = (75) → draw $75.", "tip": null}, {"id": "lbo-0dde8501", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "How are mandatory vs. optional repayments set up?", "a": "Mandatory = MIN(amortization % × original principal, balance remaining).\nOptional = MIN(cash available after mandatory payments, balance remaining), often only a % if there's a cash sweep. Pay down the cheapest/senior prepayable tranches first.", "tip": null}, {"id": "lbo-813f503e", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "How is FCF in an LBO different from FCF in a DCF?", "a": "Purpose: debt capacity, not valuation.\nIt starts from Net Income, so it's AFTER interest, unlike UFCF. It's before principal repayment, so it isn't levered FCF either.\nThen you go further: + beginning cash − minimum cash − mandatory paydown = cash available for optional repayment.", "tip": null}, {"id": "lbo-1190bcab", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "What is the \"tax shield,\" and does it matter much?", "a": "Interest is tax-deductible, so leverage lowers taxes. But cash flow is still lower than with no debt (you're paying interest), and it's a small driver compared with the entry and exit multiples.", "tip": null}, {"id": "lbo-949bfa93", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "Why the minimum cash assumption?", "a": "Every business needs operating cash. It shows up in Sources & Uses (funded at close, or leftover excess cash), and it caps how much FCF can go to paying down debt. If it isn't disclosed, estimate from historical lows or as a % of expenses.", "tip": null}, {"id": "lbo-dbff64fa", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "Why build LBOs around EBITDA and TEV/EBITDA if FCF is what matters?", "a": "Lenders and buyers price deals on it, it roughly tracks operating cash flow, it stays meaningful even when NI is negative from heavy interest, and EV multiples stay stable as debt is paid down (P/E would swing wildly), so the exit multiple is easier to choose.", "tip": null}, {"id": "lbo-60c481de", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "What ratios do you track in an LBO?", "a": "Debt / EBITDA, EBITDA / interest, and FCF conversion. Fast deleveraging (5x → 3x) suggests room for more debt or a dividend recap. Rising FCF conversion means more of the return comes from paydown.", "tip": null}, {"id": "lbo-4b3a2c1d", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "What are the exit options, and which do sponsors prefer?", "a": "• Sale (M&A) to a strategic buyer or another PE firm: clean, all proceeds at once. Preferred.\n• IPO: works for companies too big to sell, but the stake is sold down over years (price risk). Dumping it all at once signals trouble.\n• Dividend recaps: pull money out early. Partial liquidity, not a true exit.", "tip": null}, {"id": "lbo-e4b9f683", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "What IRR and multiple do PE firms target?", "a": "Usually an IRR of 20%+ (about twice long-run public equity returns). Over 5 years that's ~2.5x. Longer holds need higher multiples (~3.5x over 7 years ≈ 20%). Plus a downside case that avoids losing money.", "tip": null}, {"id": "lbo-2f201e19", "m": "lbo", "t": "qa", "f": 2, "c": true, "q": "High IRR or high multiple: which would you rather have?", "a": "It depends on time. A 50% IRR over 6 months is only ~1.2x, barely any profit. 3x over 10 years is only ~12%.\nFunds are judged on IRR, but investors also want real dollar gains (MoM). Short hold → favor the multiple. Long hold → favor IRR. Once past the hurdle rate, MoM matters more.", "tip": null}, {"id": "lbo-3acb089f", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "An extra $1 of debt paydown or an extra $1 of EBITDA?", "a": "$1 of EBITDA, because at exit it's worth $1 × the exit multiple (e.g., 8 to 10x) of EV. $1 of paydown adds exactly $1 to proceeds.", "tip": null}, {"id": "lbo-b7869671", "m": "lbo", "t": "qa", "f": 2, "c": false, "q": "Can multiple expansion be justified?", "a": "Sometimes. If ROIC and growth improve at the same WACC, a higher multiple is warranted. But it depends heavily on the market. A great operational story can still exit at a lower multiple in a weak market, so don't count on it.", "tip": null}, {"id": "lbo-2233d74c", "m": "lbo", "t": "drill", "f": 1, "c": false, "q": "$10M of revenue and $5M of EBITDA. Best lever: 20% more units, 20% higher prices, or 20% lower costs?", "a": "Prices: the full +$2M of revenue drops through → EBITDA +$2M.\nUnits: +$2M of revenue but more variable cost → less than +$2M.\nCosts: 20% × $5M of costs = +$1M.\nPricing power is the most valuable.", "tip": null}, {"id": "lbo-ed005bb8", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "How would a PE firm protect against the downside?", "a": "Avoid buying at peak multiples (multiple contraction is the big risk). Prefer companies with tangible assets or divisions that could be sold. Use structured equity (preferred / convertible preferred) to lock in some return.", "tip": null}, {"id": "lbo-bd1a1789", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "When would you reject a deal with great modeled returns, or approve one with weak returns?", "a": "Reject: no realistic exit (no buyers, no IPO path), weak credit markets, or industry problems the model doesn't capture.\nApprove: the numbers are borderline but fixable, e.g., excess cash that could fund a dividend or recap, or a capital structure that pays down debt faster.", "tip": null}, {"id": "lbo-b30f0d35", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "Why give management an option pool, and what does it cost the sponsor?", "a": "It aligns incentives at no upfront cost. Management only gets paid if the exit value beats the entry. Good outcome: a small slice of proceeds goes to management, barely moving the sponsor's IRR. Bad outcome: the options are worthless, and the sponsor loses nothing extra.", "tip": null}, {"id": "lbo-1de0b33b", "m": "lbo", "t": "qa", "f": 1, "c": false, "q": "What is a shareholder loan with PIK interest, and why use it?", "a": "Sponsor money structured as \"debt\" from the sponsor, so its accruing (non-cash) PIK interest is tax-deductible and lowers the company's taxes. It compounds onto the principal. At exit, it's still economically equity: real debt is repaid first.", "tip": null}, {"id": "tmt-20889453", "m": "tmt", "t": "qa", "f": 2, "c": false, "q": "What are the TMT verticals? Is valuation different?", "a": "Technology (software, internet, hardware, semiconductors, IT services), media and entertainment, and telecom.\nThe same methods and multiples apply. What changes are the operating metrics (ARR, churn, ARPU, LTV/CAC, subscribers) and some accounting items, like NOLs at unprofitable tech companies and content amortization at media companies.", "tip": null}, {"id": "tmt-e9160708", "m": "tmt", "t": "qa", "f": 2, "c": false, "q": "How is a wireless carrier different from a chipmaker or an enterprise software company?", "a": "Telecom and chip fabs (TSMC, not a design-only company like Nvidia) are capital-intensive with high CapEx. Software is mostly people costs.\nTelecom also has steady, inelastic demand and heavy regulation (quasi-public utility), and it's often structured as a holding company. Sum-of-the-parts comes up more often.", "tip": null}, {"id": "tmt-56652caa", "m": "tmt", "t": "qa", "f": 2, "c": false, "q": "Netflix FCF conversion looks like 70%+ using EBITDA − interest − taxes ± WC − CapEx. A coworker says it's about half that. Who's right?", "a": "The coworker. Content spending is the real \"CapEx\" of a streamer. Cash spent on content shows up as \"additions to content assets\" in operating cash flow, while EBITDA is only reduced by the smaller, slower content AMORTIZATION.\nInclude the cash content spend (essentially, use everything in CFO) and FCF conversion drops a lot.", "tip": "A good media-group question to have ready."}, {"id": "tmt-e6e18064", "m": "tmt", "t": "qa", "f": 1, "c": false, "q": "Semis (e.g., TSMC) vs. broad hardware (e.g., Samsung): what do you focus on?", "a": "Both: gross margins and CapEx efficiency. Semis add heavy R&D (somewhere between hardware and software), more cyclicality (AI and crypto cycles), and enterprise demand signals like the book-to-bill ratio and capacity utilization. The standard multiples still apply.", "tip": null}, {"id": "tmt-ad1b5ea1", "m": "tmt", "t": "qa", "f": 2, "c": true, "q": "How do you value an unprofitable tech startup that's years from positive cash flow?", "a": "1. A long-horizon DCF (possibly decades) that runs until cash flow turns positive and stabilizes, often with a discount rate that falls as the company matures.\n2. Revenue multiples, or non-financial multiples (EV / users, EV / subscribers). Those pair with EV.", "tip": null}, {"id": "tmt-97d5abc5", "m": "tmt", "t": "drill", "f": 2, "c": false, "q": "SaaS: a $240, 2-year contract signed Jan 1, billed every 6 months. Bookings, billings, and revenue for January and February?", "a": "January: bookings $240 (total contract value). Billings $60 (240 / 4 invoices). Revenue $10 (240 / 24 months).\nFebruary: bookings $0, billings $0 (next invoice is July 1), revenue $10.", "tip": null}, {"id": "tmt-cfc8e40a", "m": "tmt", "t": "drill", "f": 1, "c": false, "q": "Same contract, and customers take 2 months to pay invoices. What happens to AR and deferred revenue?", "a": "Jan 1: AR +$60 and DR +$60 (invoice issued).\nAR stays at $60 until it's collected March 1.\nDR falls $10 a month as revenue is recognized: $60 → $50 (Feb 1) → $40 (Mar 1).", "tip": null}, {"id": "tmt-8447e00d", "m": "tmt", "t": "drill", "f": 2, "c": false, "q": "ACV is $10K/year (already net of cost of sales), churn is 10%, and surviving customers pay 5% more every 2 years. Approximate LTV?", "a": "Average life ≈ 1 / 10% = 10 years. ACV rises to about $12K by year 10, so it averages ~$11K.\nLTV ≈ $11K × 10 ≈ $110K (lower if you discount it, especially for a young company).", "tip": null}, {"id": "tmt-d83cbc95", "m": "tmt", "t": "qa", "f": 2, "c": false, "q": "A SaaS company claims 4.0x LTV / CAC but has a 24-month CAC payback. What do you conclude?", "a": "Be skeptical. LTV depends on assumptions (renewals, pricing, margins). Payback is based on actual contract terms. Most SaaS companies aim for payback under 12 months. 24 months suggests the LTV assumptions are optimistic and the model is riskier than 4x implies.", "tip": null}, {"id": "tmt-623f1084", "m": "tmt", "t": "qa", "f": 2, "c": false, "q": "How is SaaS valuation different from other tech?", "a": "The same three methods, but screened and valued on revenue and growth (often ARR, which pairs with EV). Revenue multiples for high-growth or unprofitable names, and EBITDA or UFCF for mature ones (UFCF captures big upfront-billing deferred revenue). Longer DCF horizons with a discount rate that falls over time.", "tip": null}, {"id": "tmt-59f85ca1", "m": "tmt", "t": "qa", "f": 1, "c": false, "q": "What's \"content amortization,\" and why does it matter in media valuation?", "a": "Studios and streamers capitalize what they spend making or licensing content, then amortize it through cost of revenue as the content is used. Like D&A, it's non-cash on the CFS, but the real cash outflow (new content spend) is often much larger and ongoing. That's why EBITDA flatters media companies and FCF is the more honest metric.", "tip": null}]}</script>
<script>
(function(){
"use strict";
const DECK = JSON.parse(document.getElementById('deck').textContent);
const MODS = DECK.modules; const CARDS = DECK.cards;
const BY_ID = Object.fromEntries(CARDS.map(c=>[c.id,c]));
const MOD = Object.fromEntries(MODS.map((m,i)=>[m.k,{...m,i}]));
const CODE = {core:"F",acct:"A",ev:"E",val:"V",dcf:"D",ma:"M",lbo:"L",tmt:"T"};
const TYPE = {qa:"Q&A",concept:"Concept",walk:"Walkthrough",drill:"Math"};
const DAY = 864e5;
const INTERVALS = [0,1,2,4,8,16,35]; // days per box
const MASTER_BOX = 4;
const KEY = "totr.v1";

/* ---------- storage ---------- */
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.cards) return s; }catch(e){} return null; }
let S = load() || {cards:{}, days:{}, settings:{size:8, core:false, mode:"mix", mods:MODS.map(m=>m.k)}, session:null};
S.settings = Object.assign({size:8, core:false, mode:"mix", mods:MODS.map(m=>m.k)}, S.settings||{});
let localOK = true;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); localOK = true; }catch(e){ localOK = false; } }

/* ---------- optional cloud sync (db capability) ---------- */
let cloud = {ref:null, state:"off", busy:false, dirty:false, timer:null};
function cloudPayload(){ return {v:1, cards:S.cards, days:S.days, savedAt:Date.now()}; }
function merge(remote){
  if(!remote || !remote.cards) return false; let changed=false;
  for(const [id,r] of Object.entries(remote.cards)){
    if(!BY_ID[id]) continue; const l=S.cards[id];
    if(!l || (r.t||0) > (l.t||0)){ S.cards[id]=r; changed=true; }
  }
  for(const [d,n] of Object.entries(remote.days||{})){ if((S.days[d]||0) < n){ S.days[d]=n; changed=true; } }
  return changed;
}
function scheduleSync(){ cloud.dirty = true; if(!cloud.ref) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(flush, 2500); }
async function flush(){
  if(!cloud.ref || cloud.busy || !cloud.dirty) return;
  cloud.busy = true; cloud.dirty = false;
  try{ await cloud.ref.set(cloudPayload()); cloud.state="synced"; }
  catch(e){ cloud.dirty = true; cloud.state = (e && (e.code==="revoked"||e.code==="not_granted"||e.code==="invalid_argument")) ? "off" : "pending"; if(cloud.state==="off") cloud.ref=null; }
  cloud.busy = false; paintSync();
  if(cloud.dirty && cloud.ref) cloud.timer = setTimeout(flush, 8000);
}
(async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    cloud.ref = db.doc("data/users/"+uid+"/progress");
    const snap = await cloud.ref.get();
    if(snap.exists && merge(snap.data())){ persist(); if(view==="home") render(); }
    cloud.state="synced"; cloud.dirty = true; flush(); paintSync();
  }catch(e){ cloud.state = cloud.ref ? "pending" : "off"; paintSync(); }
})();
addEventListener("online", ()=>{ if(cloud.ref){ cloud.dirty=true; flush(); } });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flush(); });
function syncText(){
  if(!localOK) return "Progress can't be saved in this browser.";
  if(cloud.state==="synced") return "Progress saved on this device and synced to your account.";
  if(cloud.state==="pending") return "Saved on this device. Will sync when you're back online.";
  return "Progress saved on this device.";
}
function paintSync(){ const el=document.getElementById("syncline"); if(el) el.textContent = syncText(); }

/* ---------- scheduling ---------- */
const now = ()=>Date.now();
const today = ()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function st(id){ return S.cards[id]; }
function inScope(c){ return S.settings.mods.includes(c.m) && (!S.settings.core || c.c); }
function isDue(c){ const s=st(c.id); return s && s.d <= now(); }
function newRank(c){ return MOD[c.m].i*1000 + (c.c?0:300) + (3-c.f)*100 + CARDS.indexOf(c)%100; }
function buildQueue(opts){
  const size = opts.size || S.settings.size;
  const mode = opts.mode || S.settings.mode;
  let pool = CARDS.filter(c => opts.mod ? c.m===opts.mod && (!S.settings.core || c.c) : inScope(c));
  if(mode==="math") pool = pool.filter(c=>c.t==="drill"||c.t==="walk");
  const due = pool.filter(isDue).sort((a,b)=>st(a.id).d - st(b.id).d);
  const fresh = pool.filter(c=>!st(c.id)).sort((a,b)=>newRank(a)-newRank(b));
  let q=[];
  if(mode==="review") q = due.slice(0,size);
  else if(mode==="new") q = fresh.slice(0,size);
  else { q = due.slice(0, Math.ceil(size*0.6)); for(const c of fresh){ if(q.length>=size) break; q.push(c); } for(const c of due){ if(q.length>=size) break; if(!q.includes(c)) q.push(c); } }
  if(q.length < size && mode!=="new" && mode!=="review"){ // top up with weakest learned cards
    const weak = pool.filter(c=>st(c.id) && !q.includes(c)).sort((a,b)=> (st(a.id).b - st(b.id).b) || (st(a.id).d - st(b.id).d));
    for(const c of weak){ if(q.length>=size) break; q.push(c); }
  }
  // interleave so one module doesn't clump? keep order: due first, then new
  return q.map(c=>c.id);
}
function rate(id, r){
  const prev = st(id) || {b:0,d:0,n:0,l:0,t:0};
  const s = {...prev, n:prev.n+1, t:now()};
  if(r==="miss"){ s.b=0; s.l=prev.l+1; s.d=now(); }
  else if(r==="shaky"){ s.b=Math.max(1, Math.min(prev.b, 2)); s.d=now()+INTERVALS[s.b]*DAY*0.5; }
  else { s.b=Math.min(prev.b+1, INTERVALS.length-1); if(!prev.n) s.b=Math.max(s.b,2); s.d=now()+INTERVALS[s.b]*DAY; }
  S.cards[id]=s; S.days[today()]=(S.days[today()]||0)+1;
}
function streak(){ let n=0; const d=new Date(); for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(S.days[k]) n++; else if(n>0 || k!==today()) break; d.setDate(d.getDate()-1); if(n>400) break; } return n; }

/* ---------- rendering helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function bullet(m){ return `<span class="bullet" style="--mc:var(--m-${m})" aria-hidden="true">${CODE[m]}</span>`; }
function fmtAnswer(text){
  const lines = text.split("\n"); let html=""; let list=null;
  const close=()=>{ if(list){ html+= list.type==="ul" ? `<ul>${list.items}</ul>` : `<ol>${list.items}</ol>`; list=null; } };
  for(let raw of lines){
    const L = raw.trim(); if(!L){ close(); continue; }
    let m;
    if((m=L.match(/^[•\-]\s+(.*)/))){ if(!list||list.type!=="ul"){ close(); list={type:"ul",items:""}; } list.items+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=L.match(/^\d+\.\s+(.*)/))){ if(!list||list.type!=="ol"){ close(); list={type:"ol",items:""}; } list.items+=`<li>${inline(m[1])}</li>`; continue; }
    close();
    const longWords=(L.match(/[A-Za-z]{4,}/g)||[]).length;
    if(/[=≈]/.test(L) && /\d/.test(L) && L.length<110 && longWords<=6){ html+=`<p class="mathline">${inline(L)}</p>`; continue; }
    html+=`<p>${inline(L)}</p>`;
  }
  close(); return html;
}
function inline(s){
  s = esc(s);
  const m = s.match(/^([A-Z][^:]{0,26}):\s(.*)$/);
  if(m && !/[.!?]$/.test(m[1])) return `<span class="k">${m[1]}:</span> ${m[2]}`;
  return s;
}
function modStats(k){
  const cs = CARDS.filter(c=>c.m===k && (!S.settings.core||c.c));
  let mastered=0, learning=0, due=0;
  for(const c of cs){ const s=st(c.id); if(!s) continue; if(s.b>=MASTER_BOX) mastered++; else learning++; if(s.d<=now()) due++; }
  return {total:cs.length, mastered, learning, due, fresh:cs.length-mastered-learning};
}
function setRail(html){ $("#railIn").innerHTML = html; }

/* ---------- views ---------- */
let view = "home"; let lastRound=null; let reveal=false; let confirmReset=false; let browseQ=""; let browseMod=null;

function render(){
  if(view==="home") renderHome();
  else if(view==="study") renderStudy();
  else if(view==="done") renderDone();
  else if(view==="browse") renderBrowse();
  else if(view==="settings") renderSettings();
}

function renderHome(){
  const scope = CARDS.filter(inScope);
  const due = scope.filter(isDue).length;
