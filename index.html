  const fresh = scope.filter(c=>!st(c.id)).length;
  const mastered = scope.filter(c=>st(c.id) && st(c.id).b>=MASTER_BOX).length;
  const sess = S.session && S.session.i < S.session.q.length;
  const modes = [["mix","Mixed"],["new","New only"],["review","Due only"],["math","Math & walkthroughs"]];
  $("#app").innerHTML = `
    <div class="top"><h1>Technicals on the Train</h1>
      <button class="iconbtn" data-act="browse">Browse</button>
      <button class="iconbtn" data-act="settings" aria-label="Settings">Settings</button></div>
    <div class="hero">
      <div class="stat"><b class="num">${due}</b><span>due now</span></div>
      <div class="stat"><b class="num">${fresh}</b><span>not seen yet</span></div>
      <div class="stat"><b class="num">${mastered}<small style="font-size:14px;color:var(--muted)">/${scope.length}</small></b><span>solid${streak()>1?` · ${streak()}-day streak`:""}</span></div>
    </div>
    <div class="section"><span class="eyebrow">Round type</span></div>
    <div class="chips" role="group" aria-label="Round type">${modes.map(([k,l])=>`<button class="chip" data-mode="${k}" aria-pressed="${S.settings.mode===k}">${l}</button>`).join("")}</div>
    <div class="chips" style="margin-top:8px" role="group" aria-label="Scope">
      <button class="chip" data-act="core" aria-pressed="${S.settings.core}">Core only</button>
      ${[5,8,12,20].map(n=>`<button class="chip" data-size="${n}" aria-pressed="${S.settings.size===n}">${n} cards</button>`).join("")}
    </div>
    <p class="hint">${S.settings.core?"Core only: the must-know questions most likely in early screens.":"8 cards is about one stop-to-transfer stretch. Missed cards come back at the end of the round."}</p>
    <div class="section"><span class="eyebrow">Your route · tap a line to include or skip it</span></div>
    <ul class="route">${MODS.map(m=>{ const s=modStats(m.k); const on=S.settings.mods.includes(m.k);
      const pm = s.total? s.mastered/s.total*100:0, pl = s.total? s.learning/s.total*100:0;
      return `<li><button class="mod" data-mod="${m.k}" aria-pressed="${on}" aria-label="${esc(m.name)}: ${on?"included":"skipped"}">
        ${bullet(m.k)}
        <span style="min-width:0"><span class="name">${esc(m.name)}</span><br><span class="sub num">${s.total} cards · ${s.fresh} new · ${s.due} due</span>
          <span class="bar" aria-hidden="true"><i style="width:${pm}%;background:var(--m-${m.k})"></i><i style="width:${pl}%;background:color-mix(in srgb,var(--m-${m.k}) 35%,transparent)"></i></span></span>
        <span class="pct num">${Math.round(pm)}%</span></button></li>`; }).join("")}</ul>
    <p class="hint">Lines are in study order: accounting first, LBOs last. New cards come from the earliest line you haven't finished.</p>
    <div class="footer"><span id="syncline">${syncText()}</span></div>`;
  const q = buildQueue({});
  setRail(sess
    ? `<button class="big ghost" data-act="newround">New round</button><button class="big primary" data-act="resume">Resume · ${S.session.q.length-S.session.i} left</button>`
    : (q.length ? `<button class="big primary" data-act="start">Start round · ${q.length} card${q.length>1?"s":""}</button>`
                : `<button class="big ghost" style="flex:1" disabled>${S.settings.mode==="review"?"Nothing due. Nice.":"No cards in this selection"}</button>`));
}

function startRound(opts){
  const q = buildQueue(opts||{});
  if(!q.length) return;
  S.session = {q, i:0, res:{}, requeued:[], mod:(opts&&opts.mod)||null};
  persist(); view="study"; reveal=false; render(); scrollTop();
}
function scrollTop(){ try{ window.scrollTo({top:0}); }catch(e){} }

function renderStudy(){
  const ses = S.session; if(!ses || ses.i>=ses.q.length){ view="home"; return render(); }
  const c = BY_ID[ses.q[ses.i]]; if(!c){ ses.i++; persist(); return render(); }
  const prog = ses.q.map((id,ix)=>`<i class="${ix<ses.i ? (ses.res[ix]||"done") : ""}"></i>`).join("");
  const freq = c.f===3?`<span class="tag often">Asked often</span>`:(c.f===1?`<span class="tag">Less common</span>`:"");
  $("#app").innerHTML = `
    <div class="top"><button class="iconbtn" data-act="home" aria-label="Back to home">← Home</button><span style="flex:1"></span><span class="eyebrow num">${ses.i+1} of ${ses.q.length}</span></div>
    <div class="progress" aria-hidden="true">${prog}</div>
    <article class="card" id="card" aria-label="Flashcard">
      <div class="meta">${bullet(c.m)}<span class="eyebrow" style="color:var(--ink)">${esc(MOD[c.m].name)}</span><span class="tag">${TYPE[c.t]}</span>${freq}</div>
      <h2 class="q">${esc(c.q)}</h2>
      ${reveal ? `<div class="ans">${fmtAnswer(c.a)}${c.tip?`<div class="tip"><b>Tip</b><span>${esc(c.tip)}</span></div>`:""}</div>
                 <p class="swipehint">Swipe right if you got it, left if you missed it.</p>`
               : `<button class="tapzone" data-act="reveal">${c.t==="walk"?"Say it out loud first, then tap to check":c.t==="drill"?"Work it out, then tap to check":"Answer in your head, then tap to check"}</button>`}
    </article>`;
  setRail(reveal
    ? `<button class="rate miss" data-rate="miss">Missed<small>see again soon</small></button><button class="rate shaky" data-rate="shaky">Shaky<small>tomorrow</small></button><button class="rate got" data-rate="got">Got it<small>later</small></button>`
    : `<button class="big primary" data-act="reveal">Show answer</button>`);
  bindSwipe();
}

function doRate(r){
  const ses=S.session; const ix=ses.i; const id=ses.q[ix];
  rate(id,r); ses.res[ix]=r;
  if(r==="miss" && !ses.requeued.includes(id)){ ses.q.push(id); ses.requeued.push(id); }
  ses.i++; persist(); scheduleSync();
  try{ if(navigator.vibrate) navigator.vibrate(r==="got"?12:r==="miss"?[10,40,10]:8); }catch(e){}
  reveal=false;
  if(ses.i>=ses.q.length){ lastRound=ses; S.session=null; persist(); view="done"; } else view="study";
  render(); scrollTop();
}

function renderDone(){
  const ses=lastRound||{q:[],res:{}};
  const vals=Object.values(ses.res); const n={got:0,shaky:0,miss:0}; vals.forEach(v=>n[v]++);
  const missed=[...new Set(ses.q.filter((id,ix)=>ses.res[ix]==="miss"||ses.res[ix]==="shaky"))];
  $("#app").innerHTML = `
    <div class="top"><button class="iconbtn" data-act="home">← Home</button></div>
    <h2 class="done-h">${n.miss===0&&n.shaky===0?"Clean round.":"Round done."}</h2>
    <p style="margin:0;color:var(--muted)">${streak()>1?`${streak()} days in a row. `:""}${S.days[today()]||0} cards today.</p>
    <div class="tally"><div><b class="num" style="color:var(--got)">${n.got}</b>got it</div><div><b class="num" style="color:var(--shaky)">${n.shaky}</b>shaky</div><div><b class="num" style="color:var(--miss)">${n.miss}</b>missed</div></div>
    ${missed.length?`<div class="section"><span class="eyebrow">Worth another look</span></div><ul class="redo">${missed.map(id=>`<li>${bullet(BY_ID[id].m)} ${esc(BY_ID[id].q)}</li>`).join("")}</ul>`:""}`;
  setRail(`<button class="big ghost" data-act="home">Home</button><button class="big primary" data-act="start">Next round</button>`);
}

function renderBrowse(){
  const q = browseQ.trim().toLowerCase();
  let list = CARDS.filter(c=>(!browseMod||c.m===browseMod) && (!q || (c.q+" "+c.a).toLowerCase().includes(q)));
  const shown = list.slice(0,80);
  $("#app").innerHTML = `
    <div class="top"><button class="iconbtn" data-act="home">← Home</button><h1 style="font-size:18px">Browse cards</h1></div>
    <input class="search" id="search" type="search" placeholder="Search, e.g. goodwill, WACC, revolver" value="${esc(browseQ)}" aria-label="Search cards">
    <div class="chips" style="margin-bottom:12px"><button class="chip" data-bmod="" aria-pressed="${!browseMod}">All</button>${MODS.map(m=>`<button class="chip" data-bmod="${m.k}" aria-pressed="${browseMod===m.k}">${CODE[m.k]} · ${esc(m.name.split(" ")[0])}</button>`).join("")}</div>
    <p class="hint num" style="margin-top:0">${list.length} card${list.length===1?"":"s"}${list.length>80?" · showing the first 80":""}</p>
    ${shown.length? shown.map(c=>`<details class="item"><summary>${bullet(c.m)}<span>${esc(c.q)}</span></summary><div class="ans">${fmtAnswer(c.a)}${c.tip?`<div class="tip"><b>Tip</b><span>${esc(c.tip)}</span></div>`:""}</div></details>`).join("") : `<div class="empty">No cards match "${esc(browseQ)}".</div>`}`;
  setRail(browseMod ? `<button class="big primary" data-act="drillmod">Study ${esc(MOD[browseMod].name)}</button>` : `<button class="big primary" data-act="home">Back to rounds</button>`);
  const inp=$("#search"); inp.addEventListener("input", e=>{ browseQ=e.target.value; const pos=e.target.selectionStart; renderBrowse(); const n=$("#search"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} });
}

function renderSettings(){
  const theme = document.documentElement.getAttribute("data-theme")||"";
  $("#app").innerHTML = `
    <div class="top"><button class="iconbtn" data-act="home">← Home</button><h1 style="font-size:18px">Settings</h1></div>
    <div class="sheet">
      <label for="themeSel">Appearance <select id="themeSel"><option value="">Match system</option><option value="light"${theme==="light"?" selected":""}>Light</option><option value="dark"${theme==="dark"?" selected":""}>Dark</option></select></label>
      <label>How spacing works <span style="color:var(--muted);font-size:13.5px;text-align:right;max-width:60%">Got it pushes a card out (2 → 4 → 8 → 16 → 35 days). Shaky brings it back tomorrow. Missed repeats it at the end of the round.</span></label>
      <label>Cards in this deck <span class="num">${CARDS.length}</span></label>
      <label>Reviews logged <span class="num">${Object.values(S.days).reduce((a,b)=>a+b,0)}</span></label>
    </div>
    <p class="hint" id="syncline">${syncText()}</p>
    <div class="section"><span class="eyebrow">Start over</span></div>
    ${confirmReset ? `<p style="margin:0">This clears all progress on this device${cloud.ref?" and in your synced copy":""}. Your cards stay.</p><div class="confirm"><button data-act="cancelreset">Keep progress</button><button class="danger" data-act="doreset">Clear progress</button></div>`
                   : `<button class="linkish" data-act="askreset" style="font-size:15px">Clear all progress…</button>`}`;
  setRail(`<button class="big primary" data-act="home">Done</button>`);
  $("#themeSel").addEventListener("change", e=>{ const v=e.target.value; if(v) document.documentElement.setAttribute("data-theme",v); else document.documentElement.removeAttribute("data-theme"); S.settings.theme=v; persist(); });
}

/* ---------- swipe ---------- */
function bindSwipe(){
  const card=$("#card"); if(!card || !reveal) return;
  let x0=null,y0=null,dx=0,active=false;
  card.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse") return; x0=e.clientX; y0=e.clientY; dx=0; active=true; });
  card.addEventListener("pointermove",e=>{ if(!active) return; dx=e.clientX-x0; const dy=e.clientY-y0; if(Math.abs(dy)>Math.abs(dx)*1.2 && Math.abs(dx)<20){ return; }
    card.style.transform=`translateX(${dx*0.6}px) rotate(${dx/40}deg)`; card.classList.toggle("sw-got",dx>70); card.classList.toggle("sw-miss",dx<-70); });
  const end=()=>{ if(!active) return; active=false; card.style.transform=""; card.classList.remove("sw-got","sw-miss"); if(dx>90) doRate("got"); else if(dx<-90) doRate("miss"); };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",()=>{active=false;card.style.transform="";card.classList.remove("sw-got","sw-miss");});
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const a=b.dataset.act;
  if(b.dataset.mode){ S.settings.mode=b.dataset.mode; persist(); return render(); }
  if(b.dataset.size){ S.settings.size=+b.dataset.size; persist(); return render(); }
  if(b.dataset.mod){ const k=b.dataset.mod; const on=S.settings.mods.includes(k); if(on && S.settings.mods.length===1) return; S.settings.mods = on ? S.settings.mods.filter(x=>x!==k) : MODS.map(m=>m.k).filter(x=>x===k||S.settings.mods.includes(x)); persist(); return render(); }
  if(b.dataset.bmod!==undefined){ browseMod=b.dataset.bmod||null; return renderBrowse(); }
  if(b.dataset.rate){ return doRate(b.dataset.rate); }
  switch(a){
    case "start": case "newround": return startRound();
    case "resume": view="study"; reveal=false; return render();
    case "reveal": reveal=true; return render();
    case "home": view="home"; confirmReset=false; render(); return scrollTop();
    case "browse": view="browse"; render(); return scrollTop();
    case "settings": view="settings"; render(); return scrollTop();
    case "core": S.settings.core=!S.settings.core; persist(); return render();
    case "drillmod": return startRound({mod:browseMod, mode:"mix"});
    case "askreset": confirmReset=true; return render();
    case "cancelreset": confirmReset=false; return render();
    case "doreset": S.cards={}; S.days={}; S.session=null; persist(); scheduleSync(); confirmReset=false; view="home"; return render();
  }
});
document.addEventListener("keydown", e=>{
  if(view!=="study" || e.target.closest("input,select,textarea")) return;
  if(!reveal && (e.key===" "||e.key==="Enter")){ e.preventDefault(); reveal=true; render(); }
  else if(reveal && ["1","2","3"].includes(e.key)){ doRate({1:"miss",2:"shaky",3:"got"}[e.key]); }
});

if(S.settings.theme) document.documentElement.setAttribute("data-theme", S.settings.theme);
if(S.session && S.session.i < S.session.q.length && S.session.q.every(id=>BY_ID[id])){ view="study"; }
else S.session=null;
render();
})();
</script>
<script>
if("serviceWorker" in navigator){ addEventListener("load", ()=>{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }); }
</script>
</body>
</html>
