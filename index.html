<style>
/* Layout: one-thumb study app. Content scrolls in the middle, all controls live in a fixed bottom rail inside thumb reach. Modules wear colored "line" bullets, like a route map for the prep. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E7EC; --ink:#151A21; --muted:#5B6573; --line:#D3D9E0;
  --accent:#1E56C8; --accent-ink:#FFFFFF;
  --miss:#C23B2A; --shaky:#B87A0A; --got:#1C7F47;
  --m-core:#6B7280; --m-acct:#1E56C8; --m-ev:#7A3FC0; --m-val:#0E8A8A; --m-dcf:#D0611C; --m-ma:#B3305E; --m-lbo:#2F7D32; --m-tmt:#A87B00;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --rail-h:92px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#171C23; --sunk:#11161C; --ink:#E7EBF0; --muted:#97A1AE; --line:#29313B;
  --accent:#6E9DFF; --accent-ink:#0B1220; --miss:#F07862; --shaky:#E7B341; --got:#4FC07F;
  --m-core:#9AA3AF; --m-acct:#6E9DFF; --m-ev:#B08AF0; --m-val:#3CC2C2; --m-dcf:#F0915A; --m-ma:#EE6E9B; --m-lbo:#6CC46F; --m-tmt:#E2B640;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171C23; --sunk:#11161C; --ink:#E7EBF0; --muted:#97A1AE; --line:#29313B;
  --accent:#6E9DFF; --accent-ink:#0B1220; --miss:#F07862; --shaky:#E7B341; --got:#4FC07F;
  --m-core:#9AA3AF; --m-acct:#6E9DFF; --m-ev:#B08AF0; --m-val:#3CC2C2; --m-dcf:#F0915A; --m-ma:#EE6E9B; --m-lbo:#6CC46F; --m-tmt:#E2B640;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:14px calc(var(--rail-h) + 28px)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bullet{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-family:var(--f-display);font-weight:800;font-size:12px;flex:none;background:var(--mc,var(--m-core))}
:root[data-theme="dark"] .bullet{color:#0E1217}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bullet{color:#0E1217}}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 14px;font-size:14px;font-weight:600;font-family:var(--f-display)}

/* home */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:10px 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.section{display:flex;align-items:baseline;justify-content:space-between;margin-block:18px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.route{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.route li{border-top:1px solid var(--line)}
.route li:first-child{border-top:0}
.mod{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;text-align:left}
.mod[aria-pressed="false"]{opacity:.45}
.mod .name{font-weight:600;font-size:15.5px;line-height:1.25}
.mod .sub{font-size:12.5px;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--sunk);margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.mod .pct{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.footer{font-size:12.5px;color:var(--muted);margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 14px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12.5px}

/* rail */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rail-in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.big{flex:1;min-height:58px;border-radius:16px;border:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--surface);border:1px solid var(--line);flex:0 0 auto;padding:0 18px;font-size:15px}
.rate{flex:1;min-height:58px;border-radius:16px;border:2px solid currentColor;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rate small{font-family:var(--f-body);font-weight:500;font-size:11.5px;opacity:.8}
.rate.miss{color:var(--miss)} .rate.shaky{color:var(--shaky)} .rate.got{color:var(--got)}

/* study */
.progress{display:flex;gap:3px;margin-block:4px 12px}
.progress i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.progress i.done{background:var(--ink)} .progress i.miss{background:var(--miss)} .progress i.shaky{background:var(--shaky)} .progress i.got{background:var(--got)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 20px;touch-action:pan-y;transition:transform .18s ease,box-shadow .18s ease;position:relative}
.card .meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-display);padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.often{color:var(--accent)}
.q{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.3;letter-spacing:-.005em}
.tapzone{display:block;width:100%;margin-top:16px;padding:16px;border:1.5px dashed var(--line);border-radius:14px;background:none;color:var(--muted);font-weight:600;font-size:15px}
.ans{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:16.5px;line-height:1.55}
.ans p{margin:0 0 8px}
.ans ul,.ans ol{margin:0 0 8px;padding-left:20px}
.ans li{margin-bottom:4px}
.ans .k{font-weight:700}
.ans .mathline{font-family:var(--f-mono);font-size:14.5px;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:0 0 8px;overflow-x:auto;white-space:pre-wrap}
.tip{margin-top:12px;border-radius:12px;background:var(--sunk);padding:10px 12px;font-size:14.5px;display:flex;gap:8px}
.tip b{font-family:var(--f-display);color:var(--accent);flex:none}
.swipehint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.card.sw-got{box-shadow:0 0 0 3px var(--got)} .card.sw-miss{box-shadow:0 0 0 3px var(--miss)}

/* done */
.done-h{font-size:30px;font-weight:800;margin-block:22px 6px;letter-spacing:-.01em}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:16px}
.tally div{border-radius:var(--r);padding:12px;background:var(--surface);border:1px solid var(--line)}
.tally b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800}
.redo{list-style:none;padding:0;margin:0}
.redo li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}

/* browse */
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font-size:16px;margin-block:6px 12px}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.item summary{list-style:none;padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-weight:600;font-size:15px;line-height:1.35}
details.item summary::-webkit-details-marker{display:none}
details.item .ans{margin:0 14px 14px;padding-top:12px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.sheet label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.sheet select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.confirm{display:flex;gap:8px;margin-top:8px}
.confirm button{border-radius:10px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.confirm .danger{border-color:var(--miss);color:var(--miss)}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
@media (min-width:700px){.q{font-size:23px}}
</style>

</head>

<script type="application/json" id="deck">{"modules": [{"k": "core", "name": "Finance Basics"}, {"k": "acct", "name": "Accounting & 3 Statements"}, {"k": "ev", "name": "Equity Value, EV & Multiples"}, {"k": "val", "name": "Valuation Methods & Comps"}, {"k": "dcf", "name": "DCF & WACC"}, {"k": "ma", "name": "M&A & Merger Models"}, {"k": "lbo", "name": "LBOs"}, {"k": "tmt", "name": "TMT Extras"}], "cards": [{"id": "core-f9675f90", "m": "core", "t": "qa", "f": 2, "c": true, "q": "Why is a dollar today worth more than a dollar next year? Is it because of inflation?", "a": "Mainly opportunity cost, not inflation. A dollar you have now can be invested and be worth more than a dollar by next year.\nInflation also erodes future money, but even with zero inflation, money today would still be worth more.", "tip": "Lead with \"I could invest it.\" Mention inflation only as a secondary factor."}, {"id": "core-17f10e41", "m": "core", "t": "concept", "f": 3, "c": true, "q": "What does the Discount Rate represent?", "a": "Your opportunity cost: the annual return you could expect from other investments with similar risk.\nIt captures risk and potential return together. A higher rate means riskier, higher-return alternatives, so future cash flows are worth less to you today.", "tip": null}, {"id": "core-057eeb3d", "m": "core", "t": "qa", "f": 2, "c": true, "q": "\"A riskier company has higher potential returns, so shouldn't its Discount Rate be lower, making it worth more?\"", "a": "No. Risk and potential return move together, so there's no free lunch.\nA stock that might go up 10x can also lose a lot more than one that might go up 2x. Investors demand a higher expected return for that risk, so the Discount Rate is higher and the Present Value is lower.", "tip": null}, {"id": "core-9fd4de89", "m": "core", "t": "concept", "f": 3, "c": true, "q": "Present Value vs. Net Present Value", "a": "PV = future cash flows, each divided by (1 + r)^year, then summed. It's what the asset is worth to you today.\nNPV = PV − the upfront price you pay.\nNPV > 0 → it's worth more than it costs, so invest.", "tip": "Excel's NPV() function actually returns PV, not NPV. Watch for that on the job."}, {"id": "core-ac2a8fa6", "m": "core", "t": "concept", "f": 3, "c": true, "q": "What is IRR, in plain English?", "a": "The effective compounded annual return on an investment. Technically, it's the discount rate that makes NPV exactly zero.\nExample: $1,000 grows to $2,000 in 5 years → about a 15% IRR.\nDecision rule: invest if IRR > your Discount Rate (WACC).", "tip": null}, {"id": "core-7952c04f", "m": "core", "t": "qa", "f": 2, "c": true, "q": "What affects IRR? How is that different from what affects PV?", "a": "Both: higher cash flows, faster growth, or a higher exit/sale value raise both PV and IRR.\nDifferent:\n• The Discount Rate changes PV but NOT IRR, because IRR is the rate you solve for.\n• The upfront price changes IRR (it's the Year 0 negative), but not PV. You compare PV against the price instead.", "tip": null}, {"id": "core-69d79ae4", "m": "core", "t": "qa", "f": 2, "c": true, "q": "Why are \"PV vs. price\" and \"IRR vs. Discount Rate\" the same decision rule?", "a": "If PV at your Discount Rate is above the price, NPV > 0.\nIRR is the rate where PV equals the price, so it must be a HIGHER rate than yours (a higher rate means a lower PV).\nSo NPV > 0 ⇔ IRR > Discount Rate. Two views of the same test.", "tip": null}, {"id": "core-2d6d480a", "m": "core", "t": "drill", "f": 3, "c": true, "q": "A business throws off $100 of cash flow per year forever, with no growth. Your required return is 10%. What would you pay? What about at 20%?", "a": "Value = CF / r\n10% → $100 / 10% = $1,000\n20% → $100 / 20% = $500", "tip": "Better alternatives (a higher r) mean you pay less."}, {"id": "core-4009c931", "m": "core", "t": "drill", "f": 3, "c": true, "q": "Cash flow is $200 today, growing 4% forever. Discount Rate is 10%. Value?", "a": "Value = CF / (r − g) = $200 / (10% − 4%) = $200 / 6% ≈ $3,333", "tip": "g must be below r. Higher g → worth more. Higher r → worth less."}, {"id": "core-ff32427d", "m": "core", "t": "concept", "f": 3, "c": true, "q": "The \"most important formula in finance,\" and what each piece does", "a": "Company Value = Cash Flow / (Discount Rate − Growth Rate), where growth < discount rate.\n• More cash flow → worth more\n• Faster growth → worth more\n• Higher discount rate → worth less\nA DCF exists because growth and risk change over time. You forecast the early years explicitly, then use this formula for the far future.", "tip": null}, {"id": "core-b3fccf6b", "m": "core", "t": "qa", "f": 2, "c": true, "q": "A company's overall WACC is 11%. A new Southeast Asia airline project has an expected IRR of 10%, and the WACC for that region and industry is 8%. Should it invest?", "a": "Yes. Compare a project's IRR to the WACC for that specific project or division, not the whole company.\n10% IRR > 8% project WACC → go. The company-wide 11% is irrelevant unless the project carries the whole company's risk.", "tip": null}, {"id": "core-26ea833c", "m": "core", "t": "drill", "f": 2, "c": true, "q": "A company is 60% equity and 40% debt. Cost of Equity is 10%, Cost of Debt is 5%. WACC? (Ignore taxes here.)", "a": "60% × 10% + 40% × 5% = 6% + 2% = 8%", "tip": "In a real DCF, multiply the Cost of Debt by (1 − tax rate) first."}, {"id": "core-454eaf4d", "m": "core", "t": "qa", "f": 1, "c": true, "q": "Why is valuation harder than plugging into CF / (r − g)?", "a": "• There are many definitions of \"cash flow,\" and getting from the financial statements to cash flow takes judgment.\n• The Discount Rate is hard to estimate and can change over time.\n• Growth has to come from a real forecast; you can't just assume a number.\n• \"Value\" depends on which investors you count (Equity Value vs. Enterprise Value).", "tip": null}, {"id": "core-51c1311b", "m": "core", "t": "qa", "f": 1, "c": true, "q": "A friend pitches a real estate deal \"yielding 10% a year.\" Should you invest?", "a": "It depends on your alternatives at similar risk.\nIf you could earn 12% elsewhere with the same risk, pass. If similar-risk options pay 7%, it looks good.\nA return number means nothing without the risk attached.", "tip": null}, {"id": "acct-ab05dbe1", "m": "acct", "t": "concept", "f": 3, "c": true, "q": "The order to answer any \"walk me through the statements\" question", "a": "1. Income Statement: what changes, and what's the effect on Net Income (25% tax unless told otherwise)?\n2. Cash Flow Statement: start from NI, adjust for non-cash items and Balance Sheet changes, and get the net change in cash.\n3. Balance Sheet: Cash plus whatever else moved, then show Assets = L + E.\n4. A one-line intuition: why cash moved the way it did.", "tip": "Say the tax rate out loud. Ask whether they want each step separately or combined."}, {"id": "acct-fe4ce904", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "What are the three statements, and why do you need all three?", "a": "Income Statement: revenue, expenses, and taxes over a period, ending in Net Income (after-tax profit).\nBalance Sheet: a snapshot on one date. Assets (resources) = Liabilities + Equity (how you funded them).\nCash Flow Statement: starts with NI, adjusts for non-cash items and working capital, adds investing and financing, and ends with the net change in cash.\nWhy all three: profit ≠ cash. The statements let you get from one to the other and forecast real cash flow.", "tip": null}, {"id": "acct-cfb590e5", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "How do the three statements link together?", "a": "• NI from the IS is the top line of the CFS.\n• Add back non-cash items (D&A, SBC…), then adjust for changes in operating BS items → Cash Flow from Operations.\n• Add investing (CapEx…) and financing (debt, equity, dividends) → net change in cash.\n• Ending cash → Cash on the BS. NI, SBC, issuances, buybacks, and dividends → Common Shareholders' Equity.\n• Each CFS line ties to its BS line (CapEx and Depreciation → Net PP&E).\n• Assets side: subtract CFS entries. L&E side: add them. Check that it balances.", "tip": null}, {"id": "acct-eeb5f951", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "If you could only have one statement to judge a company, which one?", "a": "The Cash Flow Statement. It shows how much cash the business actually generates, and valuation is ultimately based on cash flow.\nThe IS includes non-cash revenue and expenses and leaves out big cash items like CapEx. The BS is just a snapshot.", "tip": "If they push for two: the IS plus beginning and ending Balance Sheets let you rebuild most of the CFS."}, {"id": "acct-e99511d5", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Can you build the third statement from the other two?", "a": "Partly. The IS plus beginning and ending Balance Sheets get you most of the CFS, with some ambiguity (e.g., you know Net PP&E changed, but not the CapEx vs. depreciation split).\nGoing the other way, building the IS from the BS + CFS, is nearly impossible because there aren't enough direct links.", "tip": null}, {"id": "acct-a94ab0ac", "m": "acct", "t": "concept", "f": 3, "c": true, "q": "What makes something show up on the Income Statement?", "a": "Two tests:\n1. It belongs entirely to this period. Revenue and expenses follow delivery, so a factory used for 20 years doesn't hit the IS when you buy it.\n2. It affects income available to common shareholders.\nThat's why CapEx, debt issuances, and stock issuances stay off the IS, and why interest and preferred dividends are on it: those investors get paid before common shareholders.", "tip": "Cash vs. non-cash doesn't matter. D&A and SBC are non-cash and still on the IS."}, {"id": "acct-51beae9b", "m": "acct", "t": "concept", "f": 2, "c": false, "q": "What makes something show up on the Cash Flow Statement?", "a": "Either:\n1. It was already on the IS but was non-cash, so you adjust it out (D&A, SBC, gains and losses), or\n2. It never hit the IS but did move cash (CapEx, debt and equity issuance, dividends).\nWorking capital changes can fall into either bucket.", "tip": null}, {"id": "acct-4635b869", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Assets vs. Liabilities vs. Equity: what's the difference?", "a": "Asset: brings a future benefit (cash coming in, growth capacity, tax savings).\nLiability: a future obligation, usually to an outside party (pay a supplier, deliver a product, repay a lender).\nEquity: also funds the assets, but tied to the owners, with no contractual cash payments (contributed capital plus accumulated after-tax profits).", "tip": null}, {"id": "acct-5cc101f2", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "Why is Accounts Receivable an asset but Deferred Revenue a liability?", "a": "They're mirror images:\n• AR: delivered, not yet paid → cash is coming to you → asset.\n• DR: paid, not yet delivered → you still owe the customer the product or service, which costs money → liability.", "tip": null}, {"id": "acct-fdfb051e", "m": "acct", "t": "qa", "f": 2, "c": true, "q": "Prepaid Expenses vs. Accounts Payable vs. Accrued Expenses", "a": "Prepaid: cash already paid, expense not yet recognized → asset (it becomes a tax-deductible expense later at no further cash cost).\nAP: expense or item received, cash not yet paid, with an invoice (legal bills, inventory on credit) → liability.\nAccrued Expenses: same idea for recurring items without invoices (wages, utilities) → liability.", "tip": "AP doesn't always tie to an IS expense. Inventory bought on credit raises AP with nothing on the IS."}, {"id": "acct-8d027e1c", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "A subscription company collects a year's fees upfront. Why do that, and what does it do to cash flow?", "a": "Time value of money: cash today beats cash later, and the company has the pricing power to demand it.\nCash goes up immediately and Deferred Revenue rises (a positive on the CFS). As service is delivered, DR falls (a negative on the CFS) while Revenue is recognized on the IS.\nNet effect: much better cash flow timing than profit timing.", "tip": null}, {"id": "acct-86a7bc97", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "A retailer starts offering 12-month installment plans on $1,200 TVs. What happens to cash flow?", "a": "Short term: cash flow falls. Instead of $1,200 at once, it gets about $100 a month, and AR builds up.\nLong term: it depends on whether installments drive enough extra sales to outweigh the slower collection.", "tip": null}, {"id": "acct-e343a857", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "A landlord offers 10% off if the company prepays a full year of rent. Does that help cash flow?", "a": "Month 1: no. Cash flow drops sharply because it pays 12 months at once (Prepaid Expenses rise), and the discount is only about one month's rent.\nFull year: yes. No more rent checks, and the total paid is 10% lower.", "tip": null}, {"id": "acct-031b364e", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Why do people say you must check the CFS for the full depreciation figure?", "a": "Companies often bury depreciation inside COGS and operating expense lines (marketing staff use computers, too), so the IS may not show it as one line. The CFS add-back shows the all-in D&A number.", "tip": null}, {"id": "acct-9cbdd23d", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "The CFO wants to pay employees mostly in stock because it \"lowers taxes and costs no cash.\" Right?", "a": "Only on the surface.\n1. SBC usually isn't cash-tax deductible when granted. Book taxes fall, but cash taxes may not, and the deduction comes later when employees exercise or vest.\n2. It creates new shares, which dilutes existing owners. That's a real cost even without cash leaving.\nUnlike D&A, SBC changes the capital structure, so treat it like a cash expense in valuation.", "tip": null}, {"id": "acct-4e2bb6a3", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "How do Debt vs. Equity funding hit the statements?", "a": "Both show up first only on the CFS (financing section) and raise Cash.\nEquity: share count rises immediately, so existing owners are diluted. There's no required payment.\nDebt: interest hits the IS (lowering NI and cash, though it's tax-deductible), and the principal has to be repaid eventually.\nDebt is usually cheaper, up to the point where the company can still comfortably service it.", "tip": null}, {"id": "acct-302ee5f5", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "You sell equipment for $85 that's on the books at $100. Why is the $15 loss a \"non-cash\" charge?", "a": "You didn't lose $15 of cash this period. You received $85 of cash.\nThe \"loss\" just says you paid more than $85 for it in an earlier period. Non-cash adjustments are about what happened to cash THIS period, so the loss gets added back in CFO, and the full $85 shows up in investing.", "tip": null}, {"id": "acct-678dc442", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Why would a company write down a factory, and how does it flow through?", "a": "When the asset is worth clearly less than its book value (damage, obsolescence, regulation).\nIS: a non-cash expense that lowers NI.\nCFS: add it back, then usually a negative Deferred Tax entry, because write-downs typically aren't cash-tax deductible.\nBS: PP&E down, DTA up, Equity down. Cash is often unchanged.", "tip": null}, {"id": "acct-88231c3e", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Why buy stocks and bonds as a company? How does it hit the statements?", "a": "It has excess cash and no better use (hiring, CapEx, M&A, buybacks, dividends, paying down debt).\nThe purchase is an investing outflow on the CFS (no IS effect). Interest or dividend income then shows up on the IS. A sale is an investing inflow, and any difference from book value is a gain or loss.", "tip": null}, {"id": "acct-c4c7628e", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Can Common Shareholders' Equity be negative? What would it mean?", "a": "Yes. Repeated losses, or big dividends and buybacks, can push it below zero.\nUsually a bad sign (persistent unprofitability). It's normal for young tech and biotech companies burning cash, and some mature companies do it deliberately through heavy buybacks.", "tip": null}, {"id": "acct-b39ae4ee", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "Your company bought a target for $1,000 and booked $400 of Goodwill and $200 of other intangibles. Why?", "a": "To keep the Balance Sheet balanced.\nYou write off the target's equity and add its assets and liabilities. If you pay more than its book equity (say it had $400), assets fall by the $1,000 paid but L&E falls by only $400.\nFill the $600 gap with identifiable intangibles first (patents, brands, customer lists: $200 here), and the rest becomes Goodwill ($400).", "tip": null}, {"id": "acct-259bace1", "m": "acct", "t": "qa", "f": 2, "c": true, "q": "How do Goodwill and other intangibles change over time?", "a": "Intangibles: amortize over their useful life (except indefinite-lived ones). That's a non-cash expense, added back on the CFS.\nGoodwill: does NOT amortize. It's tested each year and written down (impaired) if the acquisition turns out to be worth less.\nNeither is usually cash-tax deductible, so the deferred tax items move rather than cash.", "tip": null}, {"id": "acct-64402182", "m": "acct", "t": "qa", "f": 2, "c": true, "q": "Deferred Tax Assets vs. Deferred Tax Liabilities. Where do NOLs fit?", "a": "Both come from book vs. tax timing differences.\nDTL: you'll pay MORE cash tax later. Classic case: accelerated depreciation for tax purposes. Also created in M&A asset write-ups.\nDTA: you'll pay LESS cash tax later. Sources: NOLs from past losses, and expenses booked now but deductible later (SBC, write-downs).\nThe NOL piece of the DTA ≈ NOL balance × tax rate.", "tip": null}, {"id": "acct-ca518880", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Name items that are deductible for book taxes but not cash taxes. What happens on the statements?", "a": "SBC (when granted), amortization of acquired intangibles, and write-downs and impairments (goodwill, PP&E).\nThey lower book taxes on the IS but save no cash tax, so the CFS shows a negative Deferred Tax adjustment and the DTA rises. They become deductible in the \"second step\" (asset sold, options exercised).", "tip": null}, {"id": "acct-8a137cc0", "m": "acct", "t": "concept", "f": 2, "c": false, "q": "Book taxes vs. cash taxes, and how to read Deferred Taxes on the CFS", "a": "Book taxes = the IS number (pre-tax income × rate). Cash taxes = what's actually paid.\nIf cash taxes < book taxes → Deferred Taxes is a positive on the CFS (more cash), and the DTL rises or the DTA falls.\nIf cash taxes > book taxes → a negative on the CFS.\nWith both as negatives: Cash Taxes = Book Taxes + Deferred Taxes. E.g., (100) + 40 = (60) paid.", "tip": null}, {"id": "acct-2d04e3b7", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Leases under ASC 842 / IFRS 16: how do Operating and Finance Leases show up?", "a": "Leases over 12 months put a Lease Asset (Right-of-Use) and a matching Lease Liability on the BS, equal to the PV of the payments.\nFinance leases (and ALL leases under IFRS): the expense is split into interest + depreciation on the IS. Depreciation is added back, and the principal portion is a financing outflow.\nOperating leases under U.S. GAAP: one straight rent expense in OpEx. The asset and liability still shrink each year behind the scenes.", "tip": null}, {"id": "acct-7cb418ca", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "How do U.K. or German (IFRS) statements differ from U.S. GAAP?", "a": "• The IS and BS look similar, sometimes with different names (\"Turnover,\" \"Statement of Financial Position\").\n• The CFS often starts from operating or pre-tax income, or uses the direct method.\n• Interest, dividends, and taxes can sit in odd CFS sections.\n• Operating lease cost is split into interest + depreciation instead of rent.\nFor modeling, rebuild the CFS so it starts from Net Income.", "tip": null}, {"id": "acct-80f3de93", "m": "acct", "t": "qa", "f": 1, "c": false, "q": "Before projecting a company's statements, how do you simplify them?", "a": "IS: break out D&A and reorganize revenue and expense lines if that helps the forecast.\nBS: about 5 to 10 lines per side. Merge short- and long-term versions of the same item, use one Net DTA/DTL line, one CSE line, and roll up small items.\nCFS: just D&A, deferred taxes, and 1 to 2 other non-cash lines, and focus CFI/CFF on CapEx, issuances, buybacks, repayments, and dividends.", "tip": null}, {"id": "acct-a299bb9f", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "Operating expenses rise by $100. Walk it through (25% tax).", "a": "IS: Pre-tax −$100, NI −$75.\nCFS: NI −$75, nothing else, so cash −$75.\nBS: Cash −$75 = Equity −$75 (via NI). Balances.", "tip": "Simple cash expense: $100 spent, $25 back in tax savings."}, {"id": "acct-926dbac3", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "Depreciation goes up by $10. Walk it through (25% tax).", "a": "IS: Pre-tax −$10, NI −$7.50.\nCFS: NI −$7.50, add back +$10 → cash +$2.50.\nBS: Cash +$2.50, PP&E −$10 → assets −$7.50. Equity −$7.50. Balances.", "tip": "Non-cash expense: no cash cost, just a $2.50 tax shield."}, {"id": "acct-cd018b98", "m": "acct", "t": "walk", "f": 2, "c": true, "q": "Twist: depreciation goes DOWN by $10. Walk it through.", "a": "IS: Pre-tax +$10, NI +$7.50.\nCFS: NI +$7.50, but you add back $10 less → cash −$2.50.\nBS: Cash −$2.50, PP&E +$10 → assets +$7.50. Equity +$7.50. Balances.", "tip": "You lose $2.50 of tax shield. Interviewers flip the sign to see if you're reasoning or reciting."}, {"id": "acct-82660339", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A company sells a factory with a book value of $100 for $140. Walk it through.", "a": "IS: $40 gain → pre-tax +$40, NI +$30.\nCFS: NI +$30, reverse the gain −$40 in CFO, then +$140 proceeds in CFI → cash +$130.\nBS: Cash +$130, PP&E −$100 → assets +$30. Equity +$30. Balances.", "tip": "You get $140 but pay tax on only the $40 gain: $140 − $10 = $130."}, {"id": "acct-e33f71bb", "m": "acct", "t": "walk", "f": 2, "c": true, "q": "A distressed company sells a factory carried at $100 for $80. Walk it through.", "a": "IS: $20 loss → pre-tax −$20, NI −$15.\nCFS: NI −$15, add back the $20 loss, +$80 in CFI → cash +$85.\nBS: Cash +$85, PP&E −$100 → assets −$15. Equity −$15. Balances.", "tip": "$80 of proceeds plus a $5 tax benefit from the loss."}, {"id": "acct-afcc2c0a", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A customer receives a $100 product but hasn't paid yet. Walk it through. Then add the cash collection (combined).", "a": "Step 1: IS: Revenue +$100 → NI +$75. CFS: NI +$75, AR up −$100 → cash −$25. BS: Cash −$25, AR +$100 → assets +$75 = Equity +$75.\nCombined with collection: AR back to the original level → cash +$75, AR unchanged, Equity +$75.", "tip": "At first you owe tax on revenue you haven't collected. After collection, it's just a $100 sale minus $25 of tax."}, {"id": "acct-ef23cbb3", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A company gets a $10K ad-agency invoice with 60 days to pay. Walk it through. Then just the payment step.", "a": "Invoice: IS: OpEx +$10K → NI −$7.5K. CFS: NI −$7.5K, AP up +$10K → cash +$2.5K. BS: Cash +$2.5K = AP +$10K, Equity −$7.5K.\nPayment step only: no IS change. CFS: AP down −$10K → cash −$10K. BS: Cash −$10K = AP −$10K.", "tip": "Start to finish: cash −$7.5K. That's the $10K cost net of the tax shield."}, {"id": "acct-ea098f7a", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A company buys $300 of inventory with cash, then later sells it for $500. Walk each step separately.", "a": "Buy: no IS. CFS: Inventory up −$300 → cash −$300. BS: Cash −$300, Inventory +$300 (assets flat).\nSell (that step only): IS: Revenue +$500, COGS +$300 → pre-tax +$200, NI +$150. CFS: NI +$150, inventory down +$300 → cash +$450. BS: Cash +$450, Inventory −$300 → assets +$150 = Equity +$150.", "tip": "Combined: cash +$150, which is the $200 profit after tax."}, {"id": "acct-31f1dbe1", "m": "acct", "t": "walk", "f": 2, "c": true, "q": "A company prepays $20 of utilities. Walk the prepayment, then the expense recognition (combined).", "a": "Prepay: no IS. CFS: Prepaid up −$20 → cash −$20. BS: Cash −$20, Prepaid +$20 (assets flat).\nCombined after recognition: IS: OpEx +$20 → NI −$15. CFS: NI −$15, prepaid change nets to zero → cash −$15. BS: Cash −$15 = Equity −$15.", "tip": "In the end, it's a plain $20 cash expense with $5 of tax savings."}, {"id": "acct-077ff256", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A SaaS customer pays $1,200 upfront for 12 months. Walk it through. Then after month 1 ($100 delivered, $20 of delivery cost), combined.", "a": "Upfront: no IS. CFS: DR up +$1,200 → cash +$1,200. BS: Cash +$1,200 = DR +$1,200.\nAfter month 1, combined: IS: Revenue +$100, OpEx +$20 → pre-tax +$80, NI +$60. CFS: NI +$60, DR now +$1,100 → cash +$1,160. BS: Cash +$1,160 = DR +$1,100 + Equity +$60.", "tip": null}, {"id": "acct-4b51a2a0", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A company issues $100 of common stock. Then compare $100 of dividends vs. a $100 buyback.", "a": "Issuance: no IS. CFS: +$100 in CFF → cash +$100. BS: Cash +$100 = CSE +$100.\nDividend and buyback: no IS change for either. Both are −$100 in CFF → cash −$100, CSE −$100.\nDifference: a buyback reduces the share count, and dividends don't. Neither is tax-deductible.", "tip": null}, {"id": "acct-82c5be0c", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A company issues $200 of debt at 10% interest. Walk the full first year, combined.", "a": "IS: Interest $20 → pre-tax −$20, NI −$15.\nCFS: NI −$15, +$200 of debt issued → cash +$185.\nBS: Cash +$185 = Debt +$200, Equity −$15.", "tip": "$200 raised, $20 of interest paid, $5 of tax back."}, {"id": "acct-66b0ef5e", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Same $200 of 10% debt, but 20% of the principal is repaid on Dec 31. Full year, combined.", "a": "IS: unchanged. Interest is still $20 (the principal is repaid at year-end), NI −$15.\nCFS: NI −$15, +$200 issued, −$40 repaid → cash +$145.\nBS: Cash +$145 = Debt +$160, Equity −$15.", "tip": "Principal repayment never touches the IS and isn't tax-deductible."}, {"id": "acct-dc6336cb", "m": "acct", "t": "walk", "f": 3, "c": true, "q": "A company buys a $200 factory entirely with debt. What happens immediately?", "a": "IS: nothing.\nCFS: CapEx −$200, debt issued +$200 → cash unchanged.\nBS: PP&E +$200 = Debt +$200.", "tip": "One asset, one liability, no tax effect."}, {"id": "acct-c6ae4c46", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "A year later: 10% interest on the $200 of debt, 10% depreciation on the factory, and 5% of the principal repaid. Walk that year.", "a": "Interest $20, depreciation $20, repayment $10.\nIS: pre-tax −$40, NI −$30.\nCFS: NI −$30, +$20 D&A, −$10 repayment → cash −$20.\nBS: Cash −$20, PP&E −$20 → assets −$40. Debt −$10, Equity −$30 → −$40.", "tip": null}, {"id": "acct-b81517ec", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Then the factory (book value $180) is sold for $220, and the remaining $190 of debt is repaid. Just this step.", "a": "IS: $40 gain → NI +$30.\nCFS: NI +$30, reverse the gain −$40, +$220 in CFI, −$190 in CFF → cash +$20.\nBS: Cash +$20, PP&E −$180 → assets −$160. Debt −$190, Equity +$30 → −$160.", "tip": null}, {"id": "acct-10c9126f", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "A company buys $200 of inventory on credit (AP), sells it for $400, spends $100 of OpEx, and pays the supplier. Walk each step.", "a": "Step 1: no IS. CFS: inventory −$200, AP +$200 → cash flat. BS: Inventory +$200 = AP +$200.\nStep 2 (alone): IS: Revenue +$400, COGS +$200, OpEx +$100 → pre-tax +$100, NI +$75. CFS: NI +$75, inventory +$200, AP −$200 → cash +$75. BS: Cash +$75, Inventory −$200 = AP −$200, Equity +$75.", "tip": "Combined, it's just $100 of pre-tax profit → +$75 cash."}, {"id": "acct-9b420fe8", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Walmart buys $200 of inventory with debt, sells it for $400 a year later, adds $100 of OpEx, pays 4% interest, and repays 10% of the principal. Combined.", "a": "IS: Revenue 400 − COGS 200 − OpEx 100 = 100 operating income; interest $8 → pre-tax $92 → NI +$69.\nCFS: NI +$69, inventory nets to 0, debt +$200, repayment −$20 → cash +$249.\nBS: Cash +$249 = Debt +$180 + Equity +$69.", "tip": "A $75 after-tax trading profit, less after-tax interest ($6), plus net new debt ($180)."}, {"id": "acct-1cd7a67c", "m": "acct", "t": "walk", "f": 2, "c": true, "q": "A company switches a $100 cash salary to $120 of stock options. Walk it through.", "a": "Net OpEx +$20 (−$100 cash salary, +$120 SBC).\nIS: pre-tax −$20, NI −$15.\nCFS: NI −$15, +$120 SBC add-back, −$30 deferred tax (the SBC isn't cash-deductible yet) → cash +$75.\nBS: Cash +$75, DTA +$30 → assets +$105. CSE: −$15 NI + $120 SBC = +$105.", "tip": "Cash +$75: the $100 salary is no longer paid, but its $25 tax deduction goes with it, and the SBC isn't cash-deductible yet."}, {"id": "acct-462dab66", "m": "acct", "t": "walk", "f": 2, "c": true, "q": "A hurricane forces a $100 write-down on a $200 factory. Walk it through (proper tax treatment).", "a": "IS: pre-tax −$100, NI −$75.\nCFS: NI −$75, +$100 add-back, −$25 deferred taxes (not cash-deductible) → cash unchanged.\nBS: PP&E −$100, DTA +$25 → assets −$75 = Equity −$75.", "tip": "Simplified version they might accept: \"cash +$25 from tax savings.\" The precise answer: the DTA goes up, not cash."}, {"id": "acct-9d7f6598", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Book depreciation is $20, but tax depreciation is $40. Walk it through.", "a": "IS: book depreciation $20 → pre-tax −$20, NI −$15.\nCFS: NI −$15, +$20 D&A, +$5 deferred taxes (the cash tax saving is $10, not $5) → cash +$10.\nBS: Cash +$10, PP&E −$20 → assets −$10. DTL +$5, Equity −$15 → −$10.", "tip": "Real cash tax saving = $40 × 25% = $10."}, {"id": "acct-c3ee1dfa", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "U.S. GAAP operating lease: 10 years, PV $1,000, $100 of rent a year, 6% rate. Walk year 1.", "a": "Implied interest = 6% × 1,000 = $60. \"Depreciation\" = principal = 100 − 60 = $40.\nIS: rent $100 in OpEx → NI −$75.\nCFS: NI −$75. Lease asset and liability changes offset → cash −$75.\nBS: Cash −$75, lease asset +$960 → assets +$885. Lease liability +$960, Equity −$75 → +$885.", "tip": null}, {"id": "acct-a674e42a", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Same lease under IFRS (or a finance lease): 10 years, $1,000, $100 cash a year, 6%. Year 1.", "a": "Depreciation = 1,000 / 10 = $100. Interest = $60. Principal repaid = 100 − 60 = $40.\nIS: pre-tax −$160, NI −$120.\nCFS: NI −$120, +$100 depreciation, −$40 principal (CFF) → cash −$60.\nBS: Cash −$60, lease asset +$900 → +$840. Lease liability +$960, Equity −$120 → +$840.", "tip": "−$100 cash rent + $160 × 25% tax shield = −$60."}, {"id": "acct-04ff015e", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "$200 of 8% preferred stock funds $200 of investments yielding 10%. What happens after one year (combined)?", "a": "IS: interest income $20 → NI +$15. Preferred dividends $16 (not deductible) → NI to common −$1.\nCFS: start from NI to common −$1. Investment purchase and preferred issuance offset → cash −$1.\nBS: Cash −$1, investments +$200 → +$199. Preferred +$200, CSE −$1.", "tip": "Earn 10% pre-tax (7.5% after tax), pay 8% with no deduction → lose money. Preferred dividends reduce CSE, not the preferred balance."}, {"id": "acct-ac8df6b7", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "To \"boost EPS,\" a company with 1,000 shares at $1 and $300 of NI borrows $200 at 4% and buys back stock. What happens after a year?", "a": "Buyback: 200 shares → 800 left. Interest $8 → NI −$6 → $294.\nEPS: $0.30 → $294 / 800 ≈ $0.37. It goes up.\nCFS: NI −$6, debt +$200, buyback −$200 → cash −$6.\nBS: Cash −$6 = Debt +$200, CSE −$206.", "tip": "EPS rose while cash fell. EPS can be engineered."}, {"id": "acct-cc5dcb08", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "You buy a company for $500 (50% debt, 50% stock). Target: $300 of assets, no liabilities. The premium splits 50/50 between goodwill and intangibles. What happens at close?", "a": "IS: nothing.\nCFS: acquisition −$500 in CFI, debt +$250, stock +$250 → cash flat.\nBS: assets +$300 acquired, +$100 goodwill, +$100 intangibles = +$500. Debt +$250, CSE +$250.", "tip": null}, {"id": "acct-35a07f6a", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Year 1 after that deal: the target adds $200 of revenue and $100 of OpEx, debt costs 8%, and intangibles amortize over 5 years. Just this year.", "a": "Amortization $20, interest $250 × 8% = $20.\nIS: 200 − 100 − 20 − 20 = $60 pre-tax → NI +$45.\nCFS: NI +$45, +$20 amortization, −$5 deferred tax (amortization isn't cash-deductible) → cash +$60.\nBS: Cash +$60, intangibles −$20, DTA +$5 → +$45 = CSE +$45.", "tip": null}, {"id": "acct-f90314fa", "m": "acct", "t": "walk", "f": 2, "c": false, "q": "Then all $100 of goodwill is impaired. Just this step.", "a": "IS: impairment $100 → NI −$75.\nCFS: NI −$75, +$100 add-back, −$25 deferred taxes → cash unchanged.\nBS: Goodwill −$100, DTA +$25 → −$75 = CSE −$75.", "tip": null}, {"id": "acct-036adeb8", "m": "acct", "t": "concept", "f": 3, "c": true, "q": "What is Working Capital, and which definition matters?", "a": "Textbook: Current Assets − Current Liabilities.\nUseful: OPERATING WC = operating current assets − operating current liabilities. Exclude cash, investments, and debt (those are capital structure).\nMain pieces: AR, inventory, prepaids − AP, accrued expenses, deferred revenue.", "tip": null}, {"id": "acct-c5798253", "m": "acct", "t": "qa", "f": 2, "c": true, "q": "A company has negative working capital. Good or bad?", "a": "It depends on why.\nGood: little AR and inventory plus big deferred revenue. Customers prepay, so it's efficient.\nBad: negative because AP is huge. It owes suppliers a lot and collects nothing upfront.", "tip": null}, {"id": "acct-7fea1fac", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "What does the Change in Working Capital tell you?", "a": "Whether growth CONSUMES cash in advance or GENERATES cash as it happens.\nRetailers: usually negative (they buy inventory before selling).\nSubscription / prepaid businesses: usually positive (deferred revenue builds).\nIt's part of FCF, so it feeds straight into valuation.", "tip": null}, {"id": "acct-f99ea194", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "Working capital went from $50 to $200, but the CFS shows −$150, not +$150. Is the company wrong?", "a": "No. On the CFS, the change = old − new.\nIf WC were just inventory, going from 50 to 200 means you spent cash on inventory → −$150.\nRising WC uses cash. Falling WC frees up cash.", "tip": null}, {"id": "acct-c0ffaf7c", "m": "acct", "t": "qa", "f": 3, "c": true, "q": "What is Free Cash Flow, and what does positive and rising FCF mean?", "a": "Simple version: FCF = Cash Flow from Operations − CapEx.\nIt's discretionary cash after the core business and its funding costs (like interest) are paid. CFO items are mostly unavoidable, and CapEx is the one recurring investing item.\nPositive and growing (for real reasons) → no need for outside capital, and cash is available to hire, reinvest, acquire, pay dividends, or buy back stock.", "tip": null}, {"id": "acct-d196b655", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "What if FCF is negative or falling?", "a": "Find out why first.\nA one-off CapEx spike → not a big deal.\nDeclining sales and margins → real trouble. If cash runs low, it has to raise debt or equity or restructure.\nShort stretches are fine for startups. Years of burn are a red flag.", "tip": null}, {"id": "acct-d22599da", "m": "acct", "t": "qa", "f": 2, "c": true, "q": "A company called EBITDA a \"proxy for CFO.\" EBITDA grew 20% a year, then the company went bankrupt. How?", "a": "EBITDA ignores lots of real cash:\n• CapEx\n• Acquisitions (overpaying for duds)\n• Interest and required debt repayments\n• Working capital (slower collections, faster supplier payments)\n• \"One-time\" charges that keep recurring\nAny of these can drain cash while EBITDA looks great.", "tip": null}, {"id": "acct-2e754f1b", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "How do you calculate ROIC, and why does it matter?", "a": "ROIC = NOPAT / average Invested Capital.\nNOPAT = EBIT × (1 − t). Invested Capital ≈ Equity + Debt + Preferred (often net of cash).\nIt measures how much after-tax operating profit each dollar from ALL investors produces. Among similar companies, higher ROIC → deserves a higher valuation.", "tip": null}, {"id": "acct-6984a9b2", "m": "acct", "t": "qa", "f": 2, "c": false, "q": "ROE vs. ROA vs. ROIC: pros and cons", "a": "ROE and ROA use Net Income, so leverage and interest affect them. But they're \"real\" numbers from the statements that hit cash.\nROIC uses hypothetical NOPAT: neutral to capital structure, but further from actual cash.\nROA suits asset-heavy, balance-sheet businesses (banks, insurers). ROE is the general-purpose one.", "tip": null}, {"id": "acct-f2cb0bc2", "m": "acct", "t": "qa", "f": 1, "c": false, "q": "How would you tell whether a company is juicing ROE with leverage?", "a": "Watch Debt / EBITDA (rising) and EBITDA / Interest (falling) over time. Debt doesn't add to the equity denominator, and interest only nicks NI, so ROE climbs while risk quietly builds.", "tip": null}, {"id": "acct-ea6827fa", "m": "acct", "t": "qa", "f": 1, "c": false, "q": "DSO of ~5 days but DPO of ~60. What does that say?", "a": "Huge market power: it collects from customers almost immediately and pays suppliers two months later (think Amazon or Walmart). Suppliers are effectively financing it.", "tip": null}, {"id": "acct-dd27a45b", "m": "acct", "t": "qa", "f": 1, "c": false, "q": "What is the Cash Conversion Cycle? Is 5 or 30 better?", "a": "CCC = DSO + DIO − DPO: how long cash is tied up in receivables and inventory before coming back.\nLower is better, so 5 beats 30 among similar companies. It depends a lot on the industry (big retailers <10, aged spirits 100+).", "tip": null}, {"id": "acct-081b0e25", "m": "acct", "t": "qa", "f": 1, "c": false, "q": "Cash vs. accrual accounting: a customer takes a TV home \"on account.\"", "a": "Cash basis: nothing is recorded until the cash arrives, then Revenue and Cash both rise.\nAccrual: Revenue is recorded at delivery, and AR rises (not Cash). When the customer pays, AR falls and Cash rises.", "tip": null}, {"id": "ev-2ccd08a8", "m": "ev", "t": "concept", "f": 3, "c": true, "q": "What do Equity Value and Enterprise Value MEAN (not how you calculate them)?", "a": "Equity Value: the value of EVERYTHING the company has (its net assets), but only to COMMON SHAREHOLDERS.\nEnterprise Value: the value of just the CORE BUSINESS (its net operating assets), but to ALL INVESTORS: equity, debt, preferred, and others.", "tip": "Memorize the contrast: \"everything, to equity\" vs. \"core business, to everyone.\""}, {"id": "ev-3eea6b4d", "m": "ev", "t": "qa", "f": 3, "c": true, "q": "Give a plain-English analogy for Equity Value vs. Enterprise Value.", "a": "A house bought for $500K with a $100K down payment and a $400K mortgage.\nEnterprise Value = $500K (the house itself). Equity Value = $100K (your stake).\nPut $250K down instead and Equity Value becomes $250K, but the house is still worth $500K. EV doesn't care how it's financed.", "tip": null}, {"id": "ev-f33598f6", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "Why do you need both? Why not just use one?", "a": "Different methods produce different outputs. Some give Equity Value (P/E comps, Levered DCF), and others give EV (TEV/EBITDA comps, Unlevered DCF), so you have to move between them to compare.\nEV is better for comparing companies because it's mostly unaffected by capital structure. Equity Value is what shareholders actually care about: the share price.", "tip": null}, {"id": "ev-3fda01b1", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "\"Current\" vs. \"Implied\" Enterprise Value", "a": "Current: based on today's market price (share price × diluted shares, then the bridge).\nImplied: what YOUR valuation (DCF, comps) says it should be worth.\nHouse version: the list price is $500K (current), and your research says $450K (implied).", "tip": null}, {"id": "ev-ac720cee", "m": "ev", "t": "concept", "f": 3, "c": true, "q": "The basic Equity Value → Enterprise Value bridge", "a": "EV = Equity Value − Cash + Debt + Preferred Stock + Noncontrolling Interests\nThe principle: subtract NON-OPERATING ASSETS (cash, investments, equity stakes, NOLs, assets held for sale) and add claims from OTHER INVESTOR GROUPS (debt, preferred, NCI, unfunded pensions, sometimes leases).", "tip": null}, {"id": "ev-5806e303", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "Basic vs. diluted Equity Value", "a": "Basic = shares outstanding × share price.\nDiluted adds the shares that options, warrants, RSUs, and convertibles could create: Treasury Stock Method for options and warrants, \"if-converted\" for convertibles.\nDiluted is the better measure of what common shareholders really own.", "tip": null}, {"id": "ev-6ae76ef4", "m": "ev", "t": "concept", "f": 3, "c": true, "q": "The two rules for \"how does event X change Equity Value and EV?\"", "a": "1. Does Common Shareholders' Equity change? If yes, Equity Value moves by that amount (NI, dividends, issuances, buybacks).\n2. Do Net Operating Assets change? If yes, EV moves by that amount, no matter who funded it.\nCash, investments, debt, and preferred are non-operating. PP&E, inventory, AR, goodwill, AP, and deferred revenue are operating.", "tip": null}, {"id": "ev-553099f1", "m": "ev", "t": "drill", "f": 3, "c": true, "q": "A company issues $200 of common stock and keeps the cash. Effect on Equity Value and EV?", "a": "CSE +$200 → Equity Value +$200.\nNet operating assets unchanged → EV unchanged.", "tip": "In the bridge: Equity +200 and Cash −200 cancel out."}, {"id": "ev-9ef7e5c1", "m": "ev", "t": "drill", "f": 3, "c": true, "q": "It issues $100 of debt to buy a factory. Effect?", "a": "CSE unchanged → Equity Value unchanged.\nPP&E is operating → NOA +$100 → EV +$100.", "tip": "Bridge: Debt +100, Equity flat → EV +100."}, {"id": "ev-933f98fa", "m": "ev", "t": "drill", "f": 3, "c": true, "q": "It issues $100 of stock to buy a factory. Effect?", "a": "CSE +$100 → Equity Value +$100.\nNOA +$100 → EV +$100.", "tip": null}, {"id": "ev-00d471bf", "m": "ev", "t": "qa", "f": 3, "c": true, "q": "Give one event each that changes: Equity Value only; EV only; both.", "a": "Equity only: issue stock, keep the cash.\nEV only: issue debt, buy a factory.\nBoth: issue stock, buy a factory.", "tip": null}, {"id": "ev-fc393ea9", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "It issues $200 of stock and uses $100 to buy a whole company (the rest stays in cash). Effect?", "a": "Equity Value +$200 (CSE +200).\nEV +$100 (acquired operating assets +100. The leftover cash is non-operating).", "tip": "If the $100 bought short-term investments instead → EV unchanged."}, {"id": "ev-8be73794", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "$200 of debt funds a $200 acquisition of a company with $150 of equity, so $50 of goodwill is created. Effect?", "a": "Equity Value: unchanged (debt doesn't touch CSE).\nEV: +$200. Goodwill is an operating asset too, so $150 of assets + $50 of goodwill = +$200 NOA.", "tip": null}, {"id": "ev-8c13b705", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "It issues $100 of preferred stock to buy $50 of PP&E. Effect?", "a": "Equity Value: unchanged. Preferred isn't common equity.\nEV: +$50 (PP&E is operating; the other $50 sits in cash).", "tip": null}, {"id": "ev-fa53daea", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "It issues $100 of preferred and uses $50 to buy back common stock. Effect?", "a": "Equity Value: −$50 (the buyback reduces CSE).\nEV: unchanged. Nothing operational moved.", "tip": null}, {"id": "ev-b6969c47", "m": "ev", "t": "drill", "f": 2, "c": true, "q": "It issues $150 of debt + $50 of stock to buy $175 of PP&E + $25 of short-term investments. Effect?", "a": "Equity Value +$50 (stock only).\nEV +$175 (only the PP&E is operating).", "tip": null}, {"id": "ev-f6275367", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "$10 of common dividends and $10 of preferred dividends are paid. Effect?", "a": "Both reduce CSE → Equity Value −$20.\nEV unchanged.", "tip": "Preferred dividends come out of CSE, not out of the preferred stock line."}, {"id": "ev-255d5a4b", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "\"Equity Value is the market value of all assets, so a $100 debt issuance adds $100 of cash. Why doesn't Equity Value rise?\"", "a": "The premise is wrong twice:\n1. Equity Value reflects NET assets, not total assets. The new cash is offset by the new debt.\n2. It's the value to common shareholders only.\nCSE doesn't change, so Equity Value doesn't change.", "tip": null}, {"id": "ev-046b6808", "m": "ev", "t": "drill", "f": 2, "c": true, "q": "It buys $100 of inventory with cash, then sells it for $200. Effect at each step and overall (25% tax)?", "a": "Purchase: Equity flat. EV +$100 (inventory is operating, cash isn't).\nOverall: NI +$75 → Equity +$75. Inventory is back to the start, and the extra cash is non-operating → EV unchanged.", "tip": "Earning profit and letting it sit in cash doesn't make the core business worth more."}, {"id": "ev-77300de0", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "It collects $200 upfront for a service it hasn't delivered yet. Effect? Then it delivers, with $100 of OpEx (overall)?", "a": "Upfront: Equity flat. Deferred revenue is an operating LIABILITY → NOA −$200 → EV −$200.\nOverall: NI +$75 → Equity +$75. Deferred revenue is gone, and the cash is non-operating → EV unchanged.", "tip": null}, {"id": "ev-7c9d4375", "m": "ev", "t": "drill", "f": 1, "c": false, "q": "The CEO finds $100 on the street and deposits it. Effect (25% tax)?", "a": "A gain → NI +$75 → Equity +$75.\nNothing operational changed → EV unchanged.", "tip": null}, {"id": "ev-abc4df98", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "A factory takes a $100 write-down (assume it's tax-deductible), and the company issues $50 of stock to rebuild. Effect?", "a": "NI −$75, plus the $50 issuance → CSE −$25 → Equity Value −$25.\nPP&E −$100 → EV −$100.", "tip": null}, {"id": "ev-b2f6db28", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "Excess cash: repay debt vs. buy back stock. What happens to Equity Value and EV?", "a": "EV: unchanged either way (nothing operational).\nRepay debt: CSE untouched → Equity Value unchanged.\nBuyback: CSE falls → Equity Value falls by the buyback amount.", "tip": null}, {"id": "ev-7fda4425", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "A company raises its revenue growth guidance from 10% to 20%. What changes?", "a": "Implied EV and Equity Value both rise, since expected cash flows are higher.\nCurrent values may jump if the stock reacts, but no Balance Sheet line changes, so you can't tie it to the bridge.", "tip": null}, {"id": "ev-c373edb4", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "Can Equity Value be negative? Enterprise Value?", "a": "Equity Value: effectively no (price × shares can't go below zero). An implied value can come out negative, but you floor it at zero.\nEV: yes, when cash exceeds market cap plus debt. Think \"busted biotech\" trading below its cash balance.", "tip": null}, {"id": "ev-4632dcad", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "Two identical companies: one 100% equity-funded, one 50/50 debt and equity. Same EV in real life?", "a": "Probably not exactly. EV is LESS affected by capital structure, not immune to it.\nMore debt changes risk and the discount rate (default risk affects every investor), so implied values differ, and current values can drift too.", "tip": null}, {"id": "ev-dfed4d22", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "How do you get Equity Value and EV for a private company?", "a": "No share price, so you work backward from a valuation. Get implied EV from comps, precedents, or a DCF, then bridge to equity (subtract debt, add cash, etc.). Or use equity-based methods directly.", "tip": null}, {"id": "ev-14f45242", "m": "ev", "t": "drill", "f": 3, "c": true, "q": "200 shares at $10.00, plus 50 options with a $8.00 strike. Diluted Equity Value?", "a": "The options are in the money → 50 new shares. Proceeds 50 × $8 = $400 buy back $400 / $10 = 40 shares.\nNet new = 10 → diluted shares 210.\nDiluted Equity Value = 210 × $10 = $2,100.", "tip": null}, {"id": "ev-f9bc57a9", "m": "ev", "t": "drill", "f": 2, "c": true, "q": "10,000 shares at $20. 100 options at a $10 strike, 50 RSUs, and 100 convertible bonds ($100 par, $10 conversion price). Diluted Equity Value?", "a": "Options: 100 − ($1,000 / $20 = 50) = +50.\nRSUs: +50.\nConverts: in the money ($20 > $10) → $100 / $10 = 10 shares each × 100 = +1,000.\nDiluted = 10,000 + 1,100 = 11,100 → × $20 = $222,000.", "tip": null}, {"id": "ev-2eaea3d7", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "Same company, plus $10,000 of cash, $30,000 of debt, and $15,000 of NCI. Enterprise Value? (The converts are already counted as shares.)", "a": "EV = 222,000 − 10,000 + 30,000 + 15,000 = $257,000.", "tip": "This assumes the $30K of debt doesn't include the converts. Never count them as both shares and debt."}, {"id": "ev-031dcc3e", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "1M shares at $100. $10M of convertible bonds ($1,000 par, $50 conversion price). Diluted shares and Equity Value?", "a": "In the money ($100 > $50) → convert: $10M / $50 = 200,000 new shares.\nDiluted = 1.2M shares → Equity Value $120M.", "tip": "No Treasury Stock Method for converts. Holders don't pay anything to convert, since they paid when they bought the bond."}, {"id": "ev-3bb3de5d", "m": "ev", "t": "concept", "f": 2, "c": false, "q": "Treasury Stock Method in one breath", "a": "Only for in-the-money options and warrants (strike < share price). Assume all are exercised, take the exercise cash, and assume it buys back shares at the current price.\nNet new shares = options − (options × strike / price).", "tip": null}, {"id": "ev-67c85bf6", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "Why subtract Equity Investments (associates) and add Noncontrolling Interests in the bridge?", "a": "Apples to apples with metrics like EBITDA.\nOwn 30% of B (an associate): EBITDA includes 0% of B, but Equity Value includes your 30% stake → subtract it.\nOwn 75% of C (consolidated): EBITDA includes 100% of C, but Equity Value only reflects your 75% → add the 25% NCI.\nAlso: minority stakes are non-core, and NCI holders are another investor group.", "tip": null}, {"id": "ev-f38e7597", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "How do pensions factor into EV?", "a": "Only defined-benefit plans (defined-contribution plans aren't on the BS).\nAdd the unfunded portion = max(0, pension liabilities − pension assets). Employees are effectively another creditor. Multiply by (1 − t) if contributions are tax-deductible.", "tip": null}, {"id": "ev-07d16c7c", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "Do you add leases to Enterprise Value?", "a": "Match the metric. If the metric excludes an expense, include its liability in EV.\nFinance leases: generally add (EBITDA excludes their interest and depreciation).\nOperating leases, U.S. GAAP: don't add (rent is already deducted in EBITDA), unless you're using EBITDAR.\nIFRS: add all lease liabilities (EBITDA excludes all lease costs).", "tip": null}, {"id": "ev-bed7a3ba", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "Is subtracting 100% of cash really right?", "a": "Technically no. Some cash is needed to run the business (operating). Strictly, subtract only excess cash = cash − minimum cash. Almost no one has that number, so everyone subtracts all of it.", "tip": null}, {"id": "ev-9946e565", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "Why don't you subtract Goodwill in the bridge?", "a": "Goodwill is the premium paid for businesses the company still owns and runs, so it's part of the core operations. You'd only remove it if those businesses had been sold or shut down, and then the goodwill would be gone anyway.", "tip": null}, {"id": "ev-0e9640a8", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "Why subtract only part of the DTA? And what about working capital?", "a": "DTA: only the NOL piece is non-operating (and potentially valuable to a buyer). The rest is operating timing differences. You can haircut it by the valuation allowance.\nWorking capital: no adjustment. It sits in both net assets and net operating assets, so it's already inside both Equity Value and EV.", "tip": null}, {"id": "ev-3734b011", "m": "ev", "t": "concept", "f": 3, "c": true, "q": "What IS a valuation multiple?", "a": "Shorthand for a cash-flow valuation: CF / (r − g) packed into one number like \"10x.\" It bundles the market's view of growth, risk, and returns.\nPractically, it's like price per square foot. It lets you compare companies of different sizes.", "tip": null}, {"id": "ev-6e1fbeb6", "m": "ev", "t": "qa", "f": 3, "c": true, "q": "How do you decide between Equity Value and EV in the numerator?", "a": "Does the metric deduct interest expense?\n• Yes → only equity holders are left → Equity Value (Net Income → P/E, FCF, Levered FCF).\n• No → all investors still have a claim → EV (Revenue, EBIT, EBITDA, Unlevered FCF, even subscribers or users).\nBalance Sheet metrics: CSE → Equity Value. Invested Capital → EV.", "tip": null}, {"id": "ev-4fda2177", "m": "ev", "t": "qa", "f": 3, "c": true, "q": "TEV/EBITDA vs. TEV/EBIT vs. P/E: pros and cons", "a": "TEV/EBITDA: ignores capital structure AND CapEx. The best normalizer, good when CapEx isn't a key value driver.\nTEV/EBIT: ignores capital structure but partly reflects CapEx (through depreciation).\nP/E: affected by taxes, leverage, and non-core items, so it's a weak normalizer. But it's simple and widely understood, and it's the key multiple for banks and insurers.", "tip": null}, {"id": "ev-b1a5587a", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "Your company trades at 15x EBITDA, and similar-size peers trade at 10x. Most likely reason?", "a": "The market expects faster growth (say 15% vs. 5%).\nSimilar size and industry → similar risk and discount rate, so growth is the probable driver. Possibly a news event too.", "tip": null}, {"id": "ev-b3c87e98", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "How do you calculate EBIT and EBITDA for a public company?", "a": "EBIT: operating income + non-recurring charges that hit it (restructuring, legal settlements…).\nEBITDA: that EBIT + D&A taken from the CASH FLOW STATEMENT (the IS often buries D&A in other lines).", "tip": "Don't add back amortization of debt fees or discounts. That belongs to interest."}, {"id": "ev-9e45fe25", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "If cash flow matters most, why use EBIT and EBITDA in multiples instead of FCF?", "a": "Comparability. They have fewer moving parts and more consistent definitions. FCF components (CapEx, working capital, taxes, leases) vary a lot between companies, industries, and accounting systems.\nThey still loosely track the cash-flow fundamentals (ROIC, growth, discount rate).", "tip": null}, {"id": "ev-68774b92", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "Free Cash Flow vs. Unlevered FCF vs. Levered FCF", "a": "FCF = CFO − CapEx (after interest and taxes). What's available for debt paydown, M&A, dividends, buybacks.\nUFCF = EBIT × (1 − t) + D&A ± ΔWC − CapEx. Ignores capital structure. Used in DCFs.\nLFCF = FCF ± net debt issued or repaid. What's left for common shareholders. Niche.\nStrip out SBC add-backs and deduct full lease costs in all three.", "tip": null}, {"id": "ev-e72d9241", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "Why does UFCF ignore the tax savings from interest? Isn't that \"missing\" value?", "a": "No. If you ignore capital structure, you ignore ALL of it. No interest means no interest tax shield.\nThe benefit of cheap, tax-deductible debt shows up in the discount rate instead: the after-tax cost of debt in WACC.", "tip": null}, {"id": "ev-a9ce181b", "m": "ev", "t": "qa", "f": 2, "c": true, "q": "For forward multiples (Year 1 EBITDA, etc.), do you project EV?", "a": "Never. Use TODAY's Equity Value and EV for every multiple, historical and forward.\nThe current price already reflects both the past and the market's expectations for the future.", "tip": null}, {"id": "ev-1f2cd5f9", "m": "ev", "t": "qa", "f": 2, "c": false, "q": "What are EBITDAR and EBITDA-AL for?", "a": "They normalize lease accounting (U.S. GAAP vs. IFRS) and owning vs. leasing.\nEBITDAR = EBITDA + rent, so it excludes all lease costs → pair with EV INCLUDING all lease liabilities.\nEBITDA-AL (\"after leases\") deducts all lease costs → pair with EV EXCLUDING lease liabilities.", "tip": "For global comps (e.g., logistics across the U.S., EU, and Asia), EV incl. leases / EBITDAR is the safest choice."}, {"id": "ev-7649a3e3", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "Revenue $100, EBIT margin 15%, D&A 5% of revenue. Equity Value $100, cash $20, debt $40 (ignore leases). TEV/EBITDA?", "a": "EBITDA = 15 + 5 = $20.\nEV = 100 − 20 + 40 = $120.\nTEV/EBITDA = 6.0x.", "tip": null}, {"id": "ev-b75b1027", "m": "ev", "t": "drill", "f": 2, "c": true, "q": "A company trades at 10x EBITDA ($100 EBITDA). It sells an asset with $20 of EBITDA for 2x. New EV and multiple?", "a": "EV: 1,000 − 40 (operating asset swapped for cash) = $960.\nEBITDA: 100 − 20 = $80.\nNew multiple: 960 / 80 = 12x. EV went DOWN, but the multiple went UP, because the asset sold for a lower multiple than the company's.\nEquity Value: unchanged unless there's a gain or loss.", "tip": null}, {"id": "ev-b616f67a", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "Co. A: 15x P/E on $120 of NI, 15x EBITDA on $150. Co. B: 15x P/E on $100 of NI, 10x EBITDA on $200. Which has more net debt?", "a": "A: Equity 1,800, EV 2,250 → net debt $450.\nB: Equity 1,500, EV 2,000 → net debt $500.\nB has more.", "tip": "You can't eyeball it from the multiples alone. Company size matters."}, {"id": "ev-615925ac", "m": "ev", "t": "drill", "f": 2, "c": false, "q": "EBIT $100, $500 of debt at 4%, $100 of cash earning 0%, 25% tax. Equity Value $600, P/E 12x. What can you say about EV?", "a": "Implied NI to common = 600 / 12 = $50.\nExpected NI = (100 − 20) × 75% = $60 → a $10 gap → probably preferred dividends.\nSo EV > 600 − 100 + 500 = $1,000, because some preferred stock also has to be added.", "tip": null}, {"id": "ev-d1164c25", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "How do you handle a mid-year valuation (LTM)?", "a": "Use the latest Balance Sheet for cash and debt, and update the forecasts.\nLTM = last full fiscal year + year-to-date − the same period last year.\nE.g., LTM at June 30, 2026 = FY2025 + 1H26 − 1H25.", "tip": null}, {"id": "ev-ccaa2a42", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "What is calendarization?", "a": "Aligning comps with different fiscal year-ends. E.g., for a June FY company, take 50% of this FY plus 50% of next FY to approximate a calendar year, then calculate the multiples on that.", "tip": null}, {"id": "ev-18f4e3fc", "m": "ev", "t": "qa", "f": 1, "c": false, "q": "How does a multiple tie to ROIC, growth, and WACC?", "a": "For example: TEV/EBIT ≈ (1 − t) × (ROIC − g) / (ROIC × (WACC − g)).\nHigher ROIC or growth → higher multiple. Higher WACC → lower multiple. It's loose in practice because those inputs aren't constant over time.", "tip": null}, {"id": "val-8fe350d3", "m": "val", "t": "qa", "f": 3, "c": true, "q": "What's the point of valuation? Why value a company at all?", "a": "To estimate its IMPLIED value based on your own views, then compare that to its current value.\nInvestors: if implied is far from current, there may be money to make.\nBankers: to tell a client what it might get in a sale or need to pay in a purchase, which often differs from today's market price.", "tip": null}, {"id": "val-6ad211d6", "m": "val", "t": "qa", "f": 3, "c": true, "q": "Public companies already have a share price. Why value them?", "a": "The share price is the market's opinion, and the market can be wrong.\nLike a house with a $500K list price that your research says is worth $450K: you value it to test the price.", "tip": null}, {"id": "val-ec04130f", "m": "val", "t": "qa", "f": 3, "c": true, "q": "What are the main valuation methodologies, and what are the pros and cons of each?", "a": "Public comps. Pros: real market data, quick, easy to explain, no far-future guesses. Cons: true peers may not exist, noisy for thinly traded or volatile stocks, can undervalue long-term potential.\nPrecedent transactions. Pros: real prices actually paid, reflect industry M&A trends. Cons: spotty data, deal-specific quirks, few true matches.\nDCF. Pros: the \"correct\" approach in theory, company-specific, less swayed by market mood. Cons: depends heavily on far-future assumptions, and people disagree on the discount rate.", "tip": null}, {"id": "val-c040b9cc", "m": "val", "t": "qa", "f": 3, "c": true, "q": "Which method gives the highest value?", "a": "It's a trick question, since any of them can, depending on assumptions and market conditions.\nSafe answer: precedents usually beat public comps because of the control premium. The DCF is the most variable because it's so assumption-driven.", "tip": null}, {"id": "val-e80b0285", "m": "val", "t": "qa", "f": 2, "c": false, "q": "When is a DCF more useful than comps, and vice versa?", "a": "DCF: always worth building, but it's best for mature companies with stable, predictable cash flows, or when good comps are scarce.\nComps and precedents: better for early-stage companies with no forecastable path to positive cash flow, or when you can't pin down a discount rate.", "tip": null}, {"id": "val-b141c3be", "m": "val", "t": "qa", "f": 2, "c": true, "q": "Same growth and margins: which is worth more, a $500M-EBITDA healthcare company or a $500M-EBITDA industrials company?", "a": "Probably the healthcare company. It's less asset-intensive (lower CapEx and working capital), so more EBITDA converts into free cash flow, and the sector often grows faster.\nIts discount rate may be higher, but higher FCF and growth usually win. It's a generalization, so ask for more detail.", "tip": null}, {"id": "val-8f82b836", "m": "val", "t": "qa", "f": 1, "c": false, "q": "How would you value an apple tree?", "a": "Same as a company: look at what similar trees have sold for (comps), and build a DCF of the apples it'll produce, plus a terminal value, discounted at what you could earn on similar trees.", "tip": null}, {"id": "val-9a7bc60d", "m": "val", "t": "qa", "f": 2, "c": false, "q": "\"The DCF is intrinsic and comps are relative.\" True?", "a": "Mostly, but not entirely. A DCF still leans on market data: the discount rate comes from peers' betas and capital structures, and a multiples-based terminal value uses peer multiples.\nBetter phrasing: the DCF relies more on your long-term view and less on market pricing.", "tip": null}, {"id": "val-d3425d5f", "m": "val", "t": "walk", "f": 3, "c": true, "q": "Walk me through how you'd use public comps and precedent transactions.", "a": "1. Screen for similar companies or deals: industry, geography, size (plus a time window for deals).\n2. Pick metrics and multiples (e.g., revenue, EBITDA, NI → TEV/Revenue, TEV/EBITDA, P/E), and gather growth and margins for context.\n3. Calculate the min, 25th percentile, median, 75th percentile, and max for each multiple.\n4. Apply them to your company's metrics. E.g., $100M EBITDA × 7x median = $700M implied EV.\n5. Bridge to equity value and share price, and show the range.", "tip": null}, {"id": "val-729ed7c7", "m": "val", "t": "qa", "f": 2, "c": true, "q": "Give example screens for comps and precedents.", "a": "Comps: U.S. steelmakers with >$500M revenue. European legacy airlines with >€1B EBITDA.\nPrecedents: Latin American consumer/retail sellers with >$1B revenue, last 3 years. Australian infrastructure deals with >A$200M revenue, last 2 years.", "tip": "Formula: industry + geography + size (+ time for deals)."}, {"id": "val-5bfed3d3", "m": "val", "t": "qa", "f": 2, "c": false, "q": "Any screens you should avoid?", "a": "Never screen on a financial metric AND a valuation figure at once. \"Revenue < $1B and EV > $2B\" forces every TEV/Revenue above 2x, so you've rigged the result.", "tip": null}, {"id": "val-fae82beb", "m": "val", "t": "qa", "f": 2, "c": true, "q": "Why should comps be truly similar?", "a": "Multiples are driven by cash flow, growth, and the discount rate. If peers share similar risk (discount rates) and cash flow profiles, differences in multiples mostly reflect expected growth, which makes the comparison meaningful.", "tip": null}, {"id": "val-6bafaf41", "m": "val", "t": "qa", "f": 2, "c": true, "q": "How do public comps and precedents differ in practice?", "a": "Precedents add a time screen and often looser criteria.\nThey use historical (LTM) metrics, since projections at announcement are hard to find.\nMultiples are based on the purchase price at announcement.\nThe output runs higher (control premium) and wider (every deal has its own story).", "tip": null}, {"id": "val-d9b9eb46", "m": "val", "t": "qa", "f": 2, "c": true, "q": "How do you choose which metrics and multiples to use?", "a": "Usually one sales-based multiple plus 1 to 2 profit-based ones (TEV/Revenue, TEV/EBITDA, P/E): what the company sells and what it keeps.\nUnprofitable companies → lean on revenue or user metrics. Mature ones → profit or cash-flow multiples.", "tip": null}, {"id": "val-71493fcb", "m": "val", "t": "qa", "f": 2, "c": false, "q": "Why look at both historical and forward multiples?", "a": "Historical: real, but distorted by one-offs and acquisitions or divestitures.\nForward: assume a clean steady state, but they're guesses.\nSeeing both gives a fuller picture.", "tip": null}, {"id": "val-18533239", "m": "val", "t": "qa", "f": 2, "c": true, "q": "How do you interpret comps if your company trades below the median?", "a": "Only meaningful if growth and margins are similar. If peers grow 10 to 15% with 10 to 15% margins at 10 to 12x EBITDA, and your company matches them but trades at 6 to 8x, it may be undervalued.\nIf its growth or margins are much worse, a lower multiple may simply be deserved.", "tip": null}, {"id": "val-31cfa7c5", "m": "val", "t": "qa", "f": 2, "c": false, "q": "Why use the median instead of the average multiple?", "a": "Outliers. With 8x, 9x, 8x, 10x, 25x, the 25x drags the average up and the median ignores it.\nYou can still justify the 25th or 75th percentile if your company's profile matches that part of the set.", "tip": null}, {"id": "val-8dabc662", "m": "val", "t": "qa", "f": 1, "c": false, "q": "How do you gather data for public comps?", "a": "Use the latest annual and quarterly filings: diluted shares → current Equity Value → EV (latest Balance Sheet).\nLTM metrics = last FY + YTD − prior-year YTD.\nProjections come from consensus estimates (equity research, Bloomberg, CapIQ). Then calculate the multiples with current values.", "tip": null}, {"id": "val-542c6887", "m": "val", "t": "qa", "f": 1, "c": false, "q": "How do you gather data for precedent transactions?", "a": "Use the target's filings just before announcement → LTM metrics.\nTransaction Equity Value = the offer price × diluted shares → bridge to transaction EV with the Balance Sheet at announcement. Then calculate the multiples.", "tip": null}, {"id": "val-629ef0eb", "m": "val", "t": "qa", "f": 1, "c": false, "q": "Can precedents include announced but not-yet-closed deals?", "a": "Yes. An announcement still shows what one buyer thinks the target is worth. Use figures as of the announcement date.", "tip": null}, {"id": "val-9456aae6", "m": "val", "t": "qa", "f": 1, "c": false, "q": "Why are precedent multiples so \"random\"?", "a": "Every deal has its own story: distressed fire sales vs. desperate strategic buyers, competitive auctions vs. one-on-one negotiations, and different market conditions and financing.", "tip": null}, {"id": "val-89347dff", "m": "val", "t": "qa", "f": 1, "c": false, "q": "How do you handle earn-outs and synergies in precedents?", "a": "Synergies: usually excluded, since they're speculative.\nEarn-outs: no single rule. Some probability-weight them (e.g., 50%), some add the full amount, some ignore them. Be consistent.", "tip": null}, {"id": "val-98d5bc1a", "m": "val", "t": "drill", "f": 1, "c": false, "q": "A buyer acquired 80% of a target for $500M. How do you get the precedent multiples?", "a": "Gross it up to 100%: $500M / 80% = $625M Purchase Equity Value.\nThen bridge to EV with 100% of the target's Balance Sheet items, and divide by 100% of its metrics.", "tip": "Include majority-stake deals if you need more data. Skip minority stakes."}, {"id": "val-e591b7c8", "m": "val", "t": "qa", "f": 2, "c": false, "q": "What is a liquidation valuation, and when is it useful?", "a": "Estimate the market value of all assets and subtract all liabilities → implied EQUITY value.\nUseful for distressed companies (what each creditor class recovers). It badly undervalues healthy going concerns.", "tip": null}, {"id": "val-f3199a64", "m": "val", "t": "qa", "f": 2, "c": false, "q": "How does a Dividend Discount Model differ from a DCF?", "a": "Project dividends instead of FCF, discount them at the Cost of Equity, and use an equity-based terminal multiple (P/E). The outpu
